<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CADCF Portal</title>
<meta name="description" content="CADCF portal: ClassNK-accredited Continual Assessment, Development and Certification of Faculty by ISF Group.">
<style>[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: public site with top nav; signed-in portals use topbar + left nav + working canvas. Navy ink, teal actions, brass for Leadership. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --sunk:#E9EEF2; --ink:#13212E; --muted:#56687A; --line:#D5DDE4;
  --navy:#0E2A47; --bar:#0E2A47; --accent:#17766A; --accent-ink:#FFFFFF; --accent-soft:#DDF0EC;
  --basic:#2F64A0; --adv:#17766A; --lead:#9A6A12; --basic-soft:#E1EAF5; --lead-soft:#F6ECD8;
  --ok:#2E7D4F; --ok-soft:#E0F1E6; --warn:#A8660B; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE3E1; --info:#5B4BB7; --info-soft:#E9E6F8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131A; --surface:#131D27; --sunk:#0F1820; --ink:#E3EAF0; --muted:#94A5B5; --line:#25323F;
  --navy:#A9C6E4; --bar:#0A1F35; --accent:#45B3A2; --accent-ink:#06201C; --accent-soft:#163631;
  --basic:#7FA9DA; --adv:#45B3A2; --lead:#D9A84A; --basic-soft:#172739; --lead-soft:#33270F;
  --ok:#5DBB83; --ok-soft:#14301F; --warn:#E0A64A; --warn-soft:#33260F; --bad:#F07A70; --bad-soft:#3A1715; --info:#A99BF0; --info-soft:#231F3F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#131D27; --sunk:#0F1820; --ink:#E3EAF0; --muted:#94A5B5; --line:#25323F;
  --navy:#A9C6E4; --bar:#0A1F35; --accent:#45B3A2; --accent-ink:#06201C; --accent-soft:#163631;
  --basic:#7FA9DA; --adv:#45B3A2; --lead:#D9A84A; --basic-soft:#172739; --lead-soft:#33270F;
  --ok:#5DBB83; --ok-soft:#14301F; --warn:#E0A64A; --warn-soft:#33260F; --bad:#F07A70; --bad-soft:#3A1715; --info:#A99BF0; --info-soft:#231F3F; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--navy);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:.95rem;font-weight:600}
p{margin:0}
a{color:var(--accent);cursor:pointer}
small,.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul.clean{list-style:none;margin:0;padding:0}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.info{background:var(--info-soft);color:var(--info)}
.lv{font-family:var(--f-mono);font-size:.68rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.lv.basic{color:var(--basic)} .lv.advanced{color:var(--adv)} .lv.leadership{color:var(--lead)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor;flex:none}

/* layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.lg{gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.right{margin-left:auto}
hr{border:0;border-top:1px solid var(--line);margin:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
td.num,th.num{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* forms */
label{font-size:.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
.field{display:flex;flex-direction:column;min-width:0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.check input{margin-top:4px}
.check label{font-weight:400;color:var(--ink);margin:0}
.hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.ic{flex:none;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:.68rem;font-weight:700;color:#fff}
.ic.ok{background:var(--ok)} .ic.warn{background:var(--warn)} .ic.bad{background:var(--bad)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:0 6px 6px 0;font-size:.9rem}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;cursor:pointer;padding:6px 12px;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;cursor:pointer;padding:9px 14px;font-size:.88rem;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:6px 12px;font-size:.88rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* public site */
.pub-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.pub-nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;cursor:pointer;text-decoration:none}
.logo b{font-family:var(--f-display);font-size:1.3rem;color:var(--navy);letter-spacing:.02em}
.logo span{font-size:.72rem;color:var(--muted)}
.pub-links{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.pub-links a{color:var(--ink);text-decoration:none;font-size:.9rem;padding:6px 10px;border-radius:6px}
.pub-links a:hover,.pub-links a.on{background:var(--sunk)}
.pub{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:40px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:20px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.hero p.lead{font-size:1.08rem;color:var(--muted);max-width:58ch}
.accred{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
.accred .badge{font-family:var(--f-mono);font-size:.7rem;border:2px solid var(--navy);color:var(--navy);border-radius:6px;padding:8px 10px;text-align:center;line-height:1.3;font-weight:500}
.domains{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:560px){.domains{grid-template-columns:repeat(2,minmax(0,1fr))}}
.domains div{border:1px solid var(--line);border-radius:8px;padding:12px 10px;background:var(--surface);font-size:.82rem}
.domains b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--navy)}
.lvcard{border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface);height:100%}
.lvcard.basic{border-top:4px solid var(--basic)} .lvcard.advanced{border-top:4px solid var(--adv)} .lvcard.leadership{border-top:4px solid var(--lead)}
.lvcard ul{margin:0;padding-left:18px;font-size:.88rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;counter-reset:s}
.steps>div{border:1px solid var(--line);border-radius:8px;padding:14px;font-size:.86rem;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.steps>div::before{counter-increment:s;content:"Step " counter(s);font-family:var(--f-mono);font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
details{border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
details p{margin-top:8px;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding-inline:16px;background:var(--surface)}
.foot .in{max-width:1180px;margin:0 auto;padding-block:22px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}

/* auth */
.auth{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:32px 16px}
.auth .box{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:760px){.auth .box{grid-template-columns:1fr}}
.auth .side-art{background:var(--bar);color:#E7EEF5;padding:28px;display:flex;flex-direction:column;gap:14px}
.auth .side-art h2{color:#fff}
.auth .side-art small{color:#B8C7D6}
.auth .form{padding:28px;display:flex;flex-direction:column;gap:14px}
.demo-acc{display:flex;flex-direction:column;gap:6px}
.demo-acc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.18);border-radius:6px;font-size:.84rem;color:#fff}
.demo-acc button:hover{background:rgba(255,255,255,.08)}
.demo-acc button:focus-visible{outline:2px solid #fff}
.demo-acc span{color:#B8C7D6;font-size:.76rem}

/* portal shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:#fff;padding-inline:16px}
.topbar .in{display:flex;align-items:center;gap:14px;padding-block:10px;max-width:1440px;margin:0 auto}
.topbar .logo b{color:#fff}
.topbar .logo span{color:#B8C7D6}
.portal-tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:2px 8px;color:#DCE6F0}
.tb-btn{all:unset;cursor:pointer;position:relative;padding:6px 8px;border-radius:6px;color:#DCE6F0;font-size:.88rem;display:flex;align-items:center;gap:8px}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.tb-btn:focus-visible{outline:2px solid #fff}
.tb-btn .badge{position:absolute;top:0;right:0;background:var(--bad);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;line-height:1.5}
.avatar{width:28px;height:28px;border-radius:50%;background:#2B4A6B;display:grid;place-items:center;font-size:.72rem;font-weight:600;color:#fff;flex:none}
.dropdown{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:300px;max-width:min(380px,calc(100vw - 32px));box-shadow:0 12px 32px rgba(8,16,24,.18);z-index:40;padding:8px;display:flex;flex-direction:column;gap:2px}
.dropdown .it{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:.86rem;display:flex;flex-direction:column;gap:2px}
.dropdown .it:hover{background:var(--sunk)}
.dropdown .it.unread{background:var(--accent-soft)}
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;padding-inline:16px;padding-block:20px 64px;align-items:start}
.nav{position:sticky;top:72px;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;max-height:calc(100vh - 90px);overflow:auto}
.nav .grp{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 3px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .cnt{font-size:.68rem;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 7px}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:6px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap}
  .topbar .hide-sm{display:none}
}

/* journey tracker */
.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,108px),1fr))}
.jst{padding:12px 10px;border-top:3px solid var(--line);font-size:.8rem;min-width:0}
.jst b{display:block;font-size:.86rem;color:var(--ink)}
.jst .k{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.jst.done{border-color:var(--ok)} .jst.now{border-color:var(--accent);background:var(--accent-soft)} .jst.fail{border-color:var(--bad)}
.kpi{display:flex;flex-direction:column;gap:3px}
.kpi b{font-family:var(--f-display);font-size:1.8rem;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:7px;font-size:.84rem}
.hbars>div{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 48px;gap:10px;align-items:center}
.hbars i{display:block;height:12px;background:var(--accent);border-radius:3px;min-width:2px}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.list-item:last-child{border-bottom:0}
.timeline{display:flex;flex-direction:column;gap:0;font-size:.86rem}
.timeline>div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.timeline>div::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.timeline>div:last-child::before{display:none}
.timeline .pt{width:12px;height:12px;border-radius:50%;background:var(--accent);margin:4px 3px 0}
.msg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;background:var(--surface)}
.msg.mine{background:var(--accent-soft);border-color:transparent}

/* calendar */
.cal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .dow{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.cal .day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--surface);text-align:left;font:inherit;color:inherit;border-top:0;border-left:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day:hover{background:var(--sunk)}
.cal .day.out{opacity:.45}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-size:.78rem;font-weight:600;display:flex;justify-content:space-between;gap:4px}
.cal .day.today .dn>span:first-child{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.ev{font-size:.7rem;line-height:1.35;padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid currentColor}
.ev.written{color:var(--basic);background:var(--basic-soft)}
.ev.interview{color:var(--adv);background:var(--accent-soft)}
.ev.expiry{color:var(--lead);background:var(--lead-soft)}
.ev.request{color:var(--bad);background:var(--bad-soft)}
.ev.due{color:var(--info);background:var(--info-soft)}
.ev span{color:var(--ink)}
.avail-pill{font-family:var(--f-mono);font-size:.64rem;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem}
.legend label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);margin:0;cursor:pointer}
@media(max-width:700px){.cal .day{min-height:64px}.cal .ev{font-size:0;padding:0;height:5px;border-left:0;background:currentColor}.avail-pill{display:none}}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1100px){.cal-wrap{grid-template-columns:1fr}}
.av{display:inline-flex;align-items:center;gap:6px;font-size:.82rem}
.av i{width:10px;height:10px;border-radius:2px;display:inline-block}
.av-full{background:var(--ok)} .av-am,.av-pm{background:linear-gradient(90deg,var(--ok) 50%,var(--sunk) 50%)} .av-pm{background:linear-gradient(90deg,var(--sunk) 50%,var(--ok) 50%)} .av-off{background:var(--bad)} .av-none{background:var(--line)}
.acal .day{min-height:78px}
.acal .day .state{font-size:.72rem;font-weight:600;border-radius:4px;padding:2px 6px;align-self:flex-start}

 return `<header class="topbar"><div class="in">

   ${S.ui.dd==='notes'?`<div class="dropdown"><div class="row between" style="padding:4px 8px"><b>Notifications</b>${unread?'<button class="btn sm ghost" data-act="readAll">Mark all read</button>':''}</div>${notes.length?notes.slice(0,8).map(n=>`<button class="it ${n.read?'':'unread'}" data-act="openNote" data-id="${n.id}"><span>${esc(n.text)}</span><small>${fmtDT(n.at)}</small></button>`).join(''):'<div class="empty">No notifications</div>'}</div>`:''}</div>

   ${S.ui.dd==='user'?`<div class="dropdown" style="min-width:220px"><div style="padding:6px 10px"><b>${esc(S.user.name)}</b><br><small>${esc(S.user.email)}</small></div><hr>
   ${role==='candidate'?'<button class="it" data-go="c/profile">Profile and documents</button>':''}${role==='assessor'?'<button class="it" data-go="s/profile">Profile and conflicts</button>':''}
   <button class="it" data-go="">Public website</button><button class="it" data-act="theme">Switch light / dark</button><button class="it" data-act="logout">Log out</button></div>`:''}</div>
 </div></header>
 <div class="shell"><nav class="nav" aria-label="Portal">${nav.map(n=>n.g?`<span class="grp">${n.g}</span>`:`<button data-go="${n.go}" class="${n.go.split('/')[1]===key?'on':''}">${n.t}${n.c?`<span class="cnt">${n.c}</span>`:''}</button>`).join('')}</nav>
 <main class="main">${page(p)}</main></div>`;
}
const qrCanvas=(id,seed)=>{S.ui.after2=S.ui.after2||[];return `<canvas class="qr" id="${id}" width="29" height="29" data-seed="${esc(seed)}" aria-label="QR code"></canvas>`};
function drawQRs(){$$('canvas.qr').forEach(c=>{const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,29,29);x.fillStyle='#000';let h=0;for(const ch of c.dataset.seed)h=(h*31+ch.charCodeAt(0))>>>0;const fin=(a,b)=>{x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#000';x.fillRect(a+2,b+2,3,3)};for(let i=0;i<29;i++)for(let j=0;j<29;j++){h=(h*1103515245+12345)>>>0;if((h>>16)&1)x.fillRect(i,j,1,1)}x.fillStyle='#fff';[[0,0],[21,0],[0,21]].forEach(([a,b])=>x.fillRect(a,b,8,8));x.fillStyle='#000';fin(0,0);fin(21,0);fin(0,21)})}

 {g:'Certify'},{t:a?'My application':'Apply for a level',go:a?'c/application':'c/apply',c:c(['info_requested','offered'].includes(st))},

/* ---------- payment (test gateway) ---------- */
function payModal(o){const u=me();S.ui.pay={...o,cur:curOf(u),method:0,state:'form'};drawPay()}
function drawPay(){const o=S.ui.pay,s=S.db.settings;const base=o[o.cur];const tax=o.cur==='INR'?Math.round(base*s.gst)/100:0;const tot=base+tax;
 const methods=o.cur==='INR'?['UPI','Card','Net banking']:['Card','PayPal'];
 const fields={UPI:'<div class="field"><label for="pm-upi">UPI ID</label><input id="pm-upi" type="text" value="name@okbank"></div>',Card:'<div class="field"><label for="pm-cn">Card number</label><input id="pm-cn" type="text" value="4111 1111 1111 1111" inputmode="numeric"></div><div class="grid g2"><div class="field"><label for="pm-ex">Expiry</label><input id="pm-ex" type="text" value="12/29"></div><div class="field"><label for="pm-cv">CVV</label><input id="pm-cv" type="password" value="123"></div></div>','Net banking':'<div class="field"><label for="pm-bk">Bank</label><select id="pm-bk"><option>HDFC Bank</option><option>ICICI Bank</option><option>State Bank of India</option><option>Axis Bank</option></select></div>',PayPal:'<p class="muted">You will approve the payment in a PayPal window.</p>'};
 let body;
 if(o.state==='form')body=`<div class="row between"><span class="eyebrow">Test mode</span>${curSeg(o.cur,'payCur')}</div>
  <table class="sum"><tbody><tr><td>${esc(o.item)}</td><td class="num">${money(o.cur,base)}</td></tr>${o.cur==='INR'?`<tr><td>GST @ ${s.gst}% (CGST ${s.gst/2}% + SGST ${s.gst/2}%)</td><td class="num">${money('INR',tax)}</td></tr>`:''}<tr class="tot"><td>Total</td><td class="num">${money(o.cur,tot)}</td></tr></tbody></table>
  ${o.cur==='INR'?'<div class="field"><label for="pm-gst">GSTIN for invoice (optional, if your employer pays)</label><input id="pm-gst" type="text" placeholder="15-character GSTIN"></div>':''}
  <div class="tabs" role="tablist">${methods.map((m,i)=>`<button role="tab" aria-selected="${i===o.method}" data-act="payMethod" data-i="${i}">${m}</button>`).join('')}</div>${fields[methods[o.method]]||''}
  <div class="field"><label for="pm-out">Test outcome</label><select id="pm-out"><option value="ok">Payment succeeds</option><option value="fail">Payment fails</option></select></div>`;
 else if(o.state==='busy')body=`<div class="empty">Processing payment…</div>`;
 else if(o.state==='fail')body=`<div class="note bad"><b>Payment did not go through.</b> Your bank declined the transaction. No money was taken. Try again or use another method.</div>`;
 else body=`<div class="stack" style="align-items:flex-start"><span class="chip ok">Payment successful</span><h3>${money(o.cur,tot)} received</h3><p class="muted">Reference ${o.ref}. Your invoice is in Payments and invoices and has been emailed to you.</p></div>`;
 const foot=o.state==='form'?`<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="payNow">Pay ${money(o.cur,tot)}</button>`:o.state==='fail'?`<button class="btn" data-act="closeModal">Close</button><button class="btn primary" data-act="payRetry">Try again</button>`:o.state==='done'?`<button class="btn primary" data-act="closeModal">Continue</button>`:'';
 modal('Secure payment',body,{foot});
}
ACT.payMethod=el=>{S.ui.pay.method=+el.dataset.i;drawPay()};
ACT.payRetry=()=>{S.ui.pay.state='form';drawPay()};
const _setCur=ACT.setCur;ACT.setCur=el=>{if(el.dataset.k==='payCur'){S.ui.pay.cur=el.dataset.c;S.ui.pay.method=0;drawPay()}else _setCur(el)};
ACT.payNow=()=>{const o=S.ui.pay,s=S.db.settings;const out=$('#pm-out').value;const gst=$('#pm-gst')?$('#pm-gst').value:'';o.state='busy';drawPay();
 setTimeout(()=>{const u=me();const base=o[o.cur];const id='PAY-0'+(110+S.db.payments.length);

 <div class="grid g2" style="align-items:start">
 <div class="stack"><div class="card stack"><h3>Credentials submitted</h3><dl class="kv"><dt>Role</dt><dd>${esc(a.cred.title)}</dd><dt>Institute</dt><dd>${esc(a.cred.institute)}</dd><dt>Years teaching</dt><dd>${a.cred.years}</dd><dt>Hours (3 yrs)</dt><dd>${a.cred.hours}</dd><dt>CoC</dt><dd>${esc(a.cred.coc)}</dd><dt>Trainer course</dt><dd>${esc(a.cred.trainer)}</dd></dl><div class="filelist">${a.docs.map(d=>`<span class="chip">${esc(d)}</span>`).join('')}</div></div>
 <div class="card stack"><h3>Messages with ISF</h3>${a.messages.length?a.messages.map(m=>`<div class="msg ${m.from===u.id?'mine':''}"><small>${esc(U(m.from).name)} · ${fmtDT(m.at)}</small><br>${esc(m.text)}</div>`).join(''):'<p class="muted">No messages yet.</p>'}
  <form class="stack" data-submit="candReply"><textarea name="text" placeholder="${a.status==='info_requested'?'Explain what you are sending…':'Write to the ISF team…'}" style="min-height:80px" aria-label="Message" required></textarea>${a.status==='info_requested'?'<input type="file" multiple name="files" aria-label="Attach documents">':''}<button class="btn primary" style="align-self:flex-start">${a.status==='info_requested'?'Send and resume review':'Send message'}</button></form></div></div>
 <div class="card stack"><h3>History</h3><div class="timeline">${a.history.map(h=>`<div><span class="pt"></span><div><b>${(STATUS[h.status]||{label:h.status}).label}</b><br><small>${fmtDT(h.at)} · ${esc(U(h.by).name||h.by)}</small>${h.note?`<br><span class="muted">${esc(h.note)}</span>`:''}</div></div>`).join('')}</div></div></div>`};
ACT.candReply=f=>{const u=me(),a=appOf(u.id);const d=formData(f);const files=f.querySelector('[name=files]');a.messages.push({from:u.id,at:nowISO(),text:d.text});
 if(files&&files.files.length)a.docs.push(...[...files.files].map(x=>x.name));
 if(a.status==='info_requested'){setStatus(a,'submitted','Candidate responded');notify('s1',u.name+' responded to your information request.','a/application/'+a.id)}else notify('s1','New message from '+u.name,'a/application/'+a.id);
 save();render();toast('Sent to ISF')};
ACT.acceptOffer=()=>{const a=appOf(me().id);a.level=a.offerLevel;setStatus(a,'approved','Candidate accepted offered level');notify('s1',me().name+' accepted the '+LEVELS[a.level].name+' offer.','a/application/'+a.id);audit('Candidate accepted offer',a.id);save();render();toast('Offer accepted. You can now pay.')};
ACT.withdraw=()=>{const a=appOf(me().id);setStatus(a,'declined','Withdrawn by candidate');save();render()};

/* ---------- written ---------- */
C_PAGES.written=()=>{const u=me(),a=activeApp(u);
 if(!a||['submitted','info_requested','offered','approved'].includes(a.status))return `<div class="ph"><h2>Written assessment</h2></div><div class="card"><p class="muted">The written assessment opens after your eligibility is approved and your certification fee is paid.</p></div>`;
 if(a.status==='paid'){const ses=S.db.sessions.filter(s=>s.level===a.level&&s.status==='scheduled'&&daysTo(s.date)>=2);
  return `<div class="ph"><div><span class="eyebrow">${LEVELS[a.level].name} · step 1 of 3</span><h2>Book your written assessment</h2></div></div>

  ${ses.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Time (IST)</th><th>Your time</th><th class="num">Seats left</th><th></th></tr></thead><tbody>${ses.map(s=>`<tr><td>${fmtD(s.date)}</td><td>${s.time}</td><td>${localTime(s.date,s.time,u.country)}</td><td class="num">${s.seats-s.candidates.length}</td><td><button class="btn sm primary" data-act="bookSession" data-id="${s.id}" ${s.seats-s.candidates.length<1?'disabled':''}>Book</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No sittings are open for your level yet. ISF adds new dates every month; you will get an email.</div>'}`}
 if(a.status==='written_booked'){const s=S.db.sessions.find(x=>x.id===a.sessionId);const today=daysTo(s.date)===0;
  return `<div class="ph"><div><span class="eyebrow">Sitting ${s.id}</span><h2>Written assessment on ${fmtD(s.date)}</h2></div><span class="chip acc">${s.time} IST · ${localTime(s.date,s.time,u.country)} your time</span></div>
  <div class="grid g2" style="align-items:start"><div class="card stack"><h3>Before the test</h3>${['Use a laptop or desktop with a webcam. Phones are not allowed.','Install Zoom and test screen sharing.','Keep photo ID ready to show on camera.','Close all other applications and browser tabs.','Pasting is turned off. Type every answer yourself.'].map(t=>`<div class="check"><span class="ic ok">✓</span><span>${t}</span></div>`).join('')}<button class="btn sm" data-act="sysCheck" style="align-self:flex-start">Run system check</button></div>
  <div class="card stack"><h3>On the day</h3><dl class="kv"><dt>Zoom link</dt><dd>${today?`<a href="${s.zoom}" target="_blank" rel="noopener">${s.zoom}</a>`:'Shown here 30 minutes before the start'}</dd><dt>Invigilator</dt><dd>${esc(U(s.invigilator).name)}</dd><dt>Duration</dt><dd>2 hours</dd></dl>
   <button class="btn primary" data-act="startTest" ${today?'':'disabled'}>Start test</button><small>${today?'The invigilator admits you on Zoom first. Then start the test here.':'The Start button turns on when the sitting opens.'}</small>
   <button class="btn sm" data-act="cancelBooking" style="align-self:flex-start">Change sitting</button></div></div>`}
 const sc=a.scores;return `<div class="ph"><h2>Written assessment</h2>${stChip(a.status)}</div><div class="card stack">${sc.objective!=null?`<dl class="kv"><dt>Part A objective</dt><dd>${sc.objective} / ${sc.objectiveMax}</dd><dt>Part B subjective</dt><dd>${sc.subjective!=null?sc.subjective+'%':'Being marked by assessors'}</dd></dl>`:''}<p class="muted">${a.status==='written_submitted'?'Assessors are marking your subjective answers. You will get an email with the result.':'You have completed the written assessment.'}</p></div>`};
function localTime(date,time,country){const off={India:0,Singapore:150,Philippines:150,'United Arab Emirates':-90,'United Kingdom':-270}[country]||0;const d=new Date(date+'T'+time+':00');d.setMinutes(d.getMinutes()+off);return d.toTimeString().slice(0,5)+({India:' IST',Singapore:' SGT',Philippines:' PHT','United Arab Emirates':' GST','United Kingdom':' BST'}[country]||'')}
ACT.bookSession=el=>{const u=me(),a=activeApp(u);const s=S.db.sessions.find(x=>x.id===el.dataset.id);s.candidates.push(a.id);a.sessionId=s.id;setStatus(a,'written_booked');tplMail('tpl-booked',u.id,{candidate:u.name,item:'written assessment',date:fmtD(s.date),time:s.time});notify('s1',u.name+' booked sitting '+s.id,'a/sessions');save();render();toast('Booked. Confirmation emailed.')};
ACT.cancelBooking=()=>{const a=activeApp(me());const s=S.db.sessions.find(x=>x.id===a.sessionId);s.candidates=s.candidates.filter(x=>x!==a.id);a.sessionId=null;setStatus(a,'paid','Changed sitting');save();render()};
ACT.sysCheck=()=>modal('System check',['Browser supported','Camera detected','Microphone detected','Connection 12 Mbps (minimum 2 Mbps)','Screen sharing allowed'].map(t=>`<div class="check"><span class="ic ok">✓</span><span>${t}</span></div>`).join(''),{foot:'<button class="btn primary" data-act="closeModal">Done</button>'});
ACT.startTest=()=>{S.ui.exam={idx:0,ans:{},flag:{},start:Date.now(),paste:0,blur:0,orig:{}};go('c/test')};

/* ---------- exam ---------- */
const AI_WORDS=['holistic','multifaceted','seamless','leverag','furthermore','robust','foster','delve','paradigm','synerg','comprehensive framework','in conclusion'];
function examQs(a){const mc=S.db.questions.filter(q=>q.type==='mcq'&&(a.level!=='basic'||q.level==='basic'));const sj=S.db.questions.filter(q=>q.type==='subjective');return [...mc,...sj]}
C_PAGES.test=()=>{const u=me(),a=activeApp(u);const E=S.ui.exam;if(!E||!a||a.status!=='written_booked')return `<div class="card">No test in progress. <a data-go="c/written">Back</a></div>`;
 const qs=examQs(a);const q=qs[E.idx];const left=Math.max(0,120*60-Math.floor((Date.now()-E.start)/1000));
 S.ui.after=startTimer;
 const og=E.orig[q.id];
 return `<div class="exam-bar row between"><div class="row"><b>${LEVELS[a.level].name} written assessment</b><span class="chip ok"><span class="dot"></span>Invigilator connected</span></div><div class="row"><span class="timer" id="timer">${fmtSecs(left)}</span><button class="btn sm primary" data-act="submitTest">Submit test</button></div></div>
 <div class="exam"><div class="card stack">
  <span class="eyebrow">${q.type==='mcq'?'Part A · Objective':'Part B · Subjective · '+q.marks+' marks'} · Question ${E.idx+1} of ${qs.length} · ${q.comp}</span>
  <p style="font-size:1.02rem"><b>${esc(q.text)}</b></p>
  ${q.type==='mcq'?q.options.map((o,i)=>`<label class="opt"><input type="radio" name="mcq" value="${i}" data-chg="ansMcq" data-q="${q.id}" ${E.ans[q.id]==i?'checked':''}> ${'ABCD'[i]}. ${esc(o)}</label>`).join(''):
  `<textarea id="subj" data-q="${q.id}" data-inp="ansSubj" style="min-height:240px" aria-label="Your answer" spellcheck="false">${esc(E.ans[q.id]||'')}</textarea><div class="row between"><small id="wc">${wc(E.ans[q.id])} words · autosaved</small><button class="btn sm" data-act="origCheck" data-q="${q.id}">Save answer</button></div>
   ${og?`<div class="note ${og.flag?'':'ok'}">${og.flag?'<b>Parts of this answer read as if they may not be your own writing.</b> You can revise it now. An assessor reviews every answer and may ask you about it in your interview. Spelling and grammar are not penalised.':'<b>Saved.</b> This answer reads as your own writing.'}</div>`:''}
   <div id="paste-note" class="note bad" hidden><b>Pasting is turned off.</b> Type your answer yourself. The attempt has been logged for the invigilator.</div>`}
  <div class="row between"><button class="btn" data-act="qGo" data-i="${E.idx-1}" ${E.idx===0?'disabled':''}>← Previous</button><button class="btn sm" data-act="qFlag" data-q="${q.id}">${E.flag[q.id]?'Unflag':'Flag for review'}</button><button class="btn primary" data-act="qGo" data-i="${E.idx+1}" ${E.idx===qs.length-1?'disabled':''}>Next →</button></div></div>
 <aside class="stack"><div class="card stack"><h4>Questions</h4><div class="qnav">${qs.map((x,i)=>`<button class="${E.ans[x.id]!=null&&E.ans[x.id]!==''?'a':''} ${i===E.idx?'c':''}" data-act="qGo" data-i="${i}" aria-label="Question ${i+1}">${i+1}${E.flag[x.id]?'⚑':''}</button>`).join('')}</div><small>${Object.values(E.ans).filter(v=>v!==''&&v!=null).length} of ${qs.length} answered</small></div>
 <div class="card stack"><h4>Integrity</h4><small>Copy and paste are off. Leaving this window is logged. Answers are checked for originality when saved.</small><dl class="kv"><dt>Paste attempts</dt><dd>${E.paste}</dd><dt>Window left</dt><dd>${E.blur} times</dd></dl></div></aside></div>`};
const fmtSecs=s=>String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const wc=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
function startTimer(){clearInterval(S.ui.tmr);S.ui.tmr=setInterval(()=>{const el=$('#timer');if(!el||!S.ui.exam){clearInterval(S.ui.tmr);return}el.textContent=fmtSecs(Math.max(0,120*60-Math.floor((Date.now()-S.ui.exam.start)/1000)))},1000);
 const t=$('#subj');if(t){t.addEventListener('paste',e=>{e.preventDefault();S.ui.exam.paste++;$('#paste-note').hidden=false});t.addEventListener('drop',e=>e.preventDefault())}}
window.addEventListener('blur',()=>{if(S.ui.exam&&S.path==='c/test'){S.ui.exam.blur++}});
ACT.ansMcq=el=>{S.ui.exam.ans[el.dataset.q]=+el.value;const b=$$('.qnav button')[S.ui.exam.idx];if(b)b.classList.add('a')};
ACT.ansSubj=el=>{S.ui.exam.ans[el.dataset.q]=el.value;$('#wc').textContent=wc(el.value)+' words · autosaved'};
ACT.qGo=el=>{const i=+el.dataset.i;const n=examQs(activeApp(me())).length;if(i>=0&&i<n){S.ui.exam.idx=i;render()}};
ACT.qFlag=el=>{const E=S.ui.exam;E.flag[el.dataset.q]=!E.flag[el.dataset.q];render()};
ACT.origCheck=el=>{const t=(S.ui.exam.ans[el.dataset.q]||'').toLowerCase();const hits=AI_WORDS.filter(w=>t.includes(w)).length;S.ui.exam.orig[el.dataset.q]={flag:hits>=2,score:Math.min(95,15+hits*22)};render()};
ACT.submitTest=()=>{const a=activeApp(me());const qs=examQs(a);const n=qs.filter(q=>S.ui.exam.ans[q.id]!=null&&S.ui.exam.ans[q.id]!=='').length;modal('Submit your test?',`<p>You have answered <b>${n} of ${qs.length}</b> questions${Object.values(S.ui.exam.flag).some(Boolean)?' and flagged some for review':''}. You cannot change answers after submitting.</p>`,{foot:'<button class="btn" data-act="closeModal">Keep working</button><button class="btn primary" data-act="confirmSubmit">Submit test</button>'})};
ACT.confirmSubmit=()=>{const u=me(),a=activeApp(u),E=S.ui.exam;const qs=examQs(a);const mc=qs.filter(q=>q.type==='mcq');const correct=mc.filter(q=>E.ans[q.id]===q.answer).length;
 a.scores.objective=Math.round(correct/mc.length*40);a.scores.objectiveMax=40;S.db.answers[a.id]={};qs.filter(q=>q.type==='subjective').forEach(q=>{const o=E.orig[q.id]||{score:12};S.db.answers[a.id][q.id]={text:E.ans[q.id]||'',ai:o.score,typing:'captured',paste:E.paste,focus:E.blur+' times',similarity:4}});
 setStatus(a,'written_submitted');S.db.allocations.push({id:uid('AL'),kind:'script',app:a.id,assessor:null,status:'unallocated',due:dd(7),at:nowISO(),result:null});
 if(Object.values(E.orig).some(o=>o.flag))S.db.integrity.unshift({id:uid('IC'),app:a.id,q:'Part B',source:'Written test '+a.sessionId,evidence:'Originality check flagged at least one subjective answer.',assessorView:'',outcome:'pending',reviewer:null});
 notify('s1',u.name+' submitted the written test. Allocate the script.','a/allocation');sendEmail(u.id,'CADCF: written test submitted','We have received your answers. Results follow after marking.','Test submitted');audit('Written test submitted',a.id);
 S.ui.exam=null;clearInterval(S.ui.tmr);save();closeModal();go('c/written');toast('Test submitted')};

/* ---------- lecture ---------- */
C_PAGES.lecture=()=>{const u=me(),a=activeApp(u);
 if(!a||STATUS[a.status].stage<4)return `<div class="ph"><h2>Lecture upload</h2></div><div class="card"><p class="muted">The lecture upload opens after you pass the written assessment.</p></div>`;
 if(a.status==='written_passed'){const f=S.ui.lecFile;return `<div class="ph"><div><span class="eyebrow">Delivery assessment</span><h2>Upload your recorded lecture</h2></div></div>
 <form class="grid g2" style="align-items:start" data-submit="lecSubmit"><div class="card stack">
  <div class="field"><label for="l-t">Session type</label><select id="l-t" name="type"><option>Theory session</option>${S.db.settings.stages[a.level].simulator?'<option>Simulator briefing</option>':''}</select></div>

  <div class="check"><input type="checkbox" id="l-c" required><label for="l-c">This is my own unedited delivery, and the learners in the recording agreed to be filmed.</label></div>
  <button class="btn primary" ${f?'':'disabled'}>Submit for review</button></div>
 <div class="card stack"><h3>What assessors look for</h3><ul style="margin:0;padding-left:18px">${['Objectives stated and achieved','Questioning and learner engagement','Use of training aids, simulator or technology','Checks of understanding','Time management'].map(x=>`<li>${x}</li>`).join('')}</ul><small>Assessors leave remarks at specific moments in your video.</small></div></form>`}
 const L=a.lecture;return `<div class="ph"><h2>Lecture</h2>${stChip(a.status)}</div><div class="card stack">${L?`<dl class="kv"><dt>File</dt><dd>${esc(L.file)} (${esc(L.size)})</dd><dt>Type</dt><dd>${esc(L.type)}</dd><dt>Topic</dt><dd>${esc(L.topic)}</dd><dt>Submitted</dt><dd>${fmtDT(L.at)}</dd><dt>Result</dt><dd>${a.scores.lecture||'Under review'}</dd></dl>`:`<p class="muted">Lecture result: ${a.scores.lecture||'not recorded'}.</p>`}${L&&L.remarks?`<h4>Assessor remarks</h4><div class="timeline">${L.remarks.map(r=>`<div><span class="pt"></span><div><b class="mono">${r.t}</b> ${esc(r.text)}</div></div>`).join('')}</div>`:''}</div>`};
ACT.lecFile=el=>{const f=el.files[0];if(!f)return;S.ui.lecFile={name:f.name,size:(f.size/1048576).toFixed(1)+' MB'};const form=el.closest('form');const keep=formData(form);render();const f2=$('form[data-submit=lecSubmit]');Object.entries(keep).forEach(([k,v])=>{const i=f2.querySelector(`[name=${k}]`);if(i)i.value=v})};
ACT.lecSubmit=f=>{const u=me(),a=activeApp(u);const d=formData(f);a.lecture={file:S.ui.lecFile.name,size:S.ui.lecFile.size,type:d.type,topic:d.topic,obj:d.obj,at:nowISO()};S.ui.lecFile=null;setStatus(a,'lecture_submitted');
 S.db.allocations.push({id:uid('AL'),kind:'lecture',app:a.id,assessor:null,status:'unallocated',due:dd(7),at:nowISO(),result:null});notify('s1',u.name+' uploaded a lecture. Allocate a reviewer.','a/allocation');audit('Lecture submitted',a.id);save();render();toast('Lecture submitted for review')};

/* ---------- interview ---------- */
function panelAvail(date,slot){return S.db.users.filter(x=>x.role==='assessor'&&x.panel).filter(x=>{const v=(S.db.availability[x.id]||{})[date];return v==='full'||v===slot}).length}
C_PAGES.interview=()=>{const u=me(),a=activeApp(u);
 if(!a||STATUS[a.status].stage<5)return `<div class="ph"><h2>Panel interview</h2></div><div class="card"><p class="muted">Interview booking opens after your lecture is reviewed and passed.</p></div>`;
 if(a.status==='lecture_passed'){const sel=S.ui.ivPick||[];const days=[];for(let n=5;n<=26;n++){const dt=dd(n);const w=new Date(dt+'T00:00:00').getDay();if(w===0||w===6)continue;days.push(dt)}
  return `<div class="ph"><div><span class="eyebrow">Step 1 of 2</span><h2>Choose your interview dates</h2></div><span class="chip">${sel.length} of 3 selected</span></div>
  <p class="muted">Pick up to three sessions when a panel of at least ${S.db.settings.minPanel} assessors is available. ISF confirms one of them after the panellists accept. Morning sessions start at 10:30 IST; afternoon sessions at 15:00 IST.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Morning 10:30 IST</th><th>Afternoon 15:00 IST</th></tr></thead><tbody>${days.map(dt=>`<tr><td>${new Date(dt+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})}</td>${['am','pm'].map(sl=>{const n=panelAvail(dt,sl);const on=sel.some(x=>x.date===dt&&x.slot===sl);return `<td>${n>=S.db.settings.minPanel?`<button class="btn sm ${on?'primary':''}" data-act="ivPick" data-d="${dt}" data-s="${sl}" aria-pressed="${on}">${on?'Selected':'Available'}</button>`:'<span class="muted">Not available</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
  <form class="card stack" data-submit="ivRequest"><div class="field"><label for="iv-n">Anything ISF should know? (optional)</label><input id="iv-n" name="note" type="text" placeholder="e.g. I am at sea from 20 Nov"></div><button class="btn primary" ${sel.length?'':'disabled'} style="align-self:flex-start">Send ${sel.length||''} preferred date${sel.length===1?'':'s'}</button></form>`}
 if(a.status==='interview_requested'){const r=S.db.requests.find(x=>x.app===a.id&&x.status==='pending');return `<div class="ph"><h2>Panel interview</h2>${stChip(a.status)}</div><div class="card stack"><h3>Your preferred dates</h3>${r?r.dates.map(x=>`<div class="list-item"><span class="dot" style="color:var(--accent);margin-top:7px"></span>${fmtD(x.date)} · ${x.slot==='am'?'10:30':'15:00'} IST</div>`).join(''):''}<p class="muted">ISF will confirm one of these dates by email.</p></div>`}

const EV_TYPES={written:'Written sittings',interview:'Interviews',request:'Date requests',expiry:'Certificate expiries',due:'Review due dates'};
function calEvents(d){const db=S.db,out=[];
 db.sessions.filter(s=>s.date===d).forEach(s=>out.push({type:'written',label:`${s.time} Written · ${LEVELS[s.level].name} · ${s.candidates.length}/${s.seats}`,ref:s.id}));
 db.interviews.filter(i=>i.date===d&&i.status!=='cancelled').forEach(i=>{const a=APP(i.app);const pend=Object.values(i.accept).filter(v=>v!=='accepted').length;out.push({type:'interview',label:`${i.time} Interview · ${U(a.user).name}${pend?' · '+pend+' unconfirmed':''}`,ref:i.id})});
 db.requests.filter(r=>r.status==='pending').forEach(r=>r.dates.filter(x=>x.date===d).forEach(x=>out.push({type:'request',label:`Requested ${x.slot==='am'?'AM':'PM'} · ${U(APP(r.app).user).name}`,ref:r.id})));
 db.certificates.filter(c=>c.expires===d&&c.status!=='revoked').forEach(c=>out.push({type:'expiry',label:`Expires · ${c.name}`,ref:c.id}));
 db.allocations.filter(a=>a.due===d&&a.status!=='done').forEach(a=>out.push({type:'due',label:`Review due · ${a.kind==='lecture'?'lecture':'script'} · ${a.assessor?U(a.assessor).name:'unallocated'}`,ref:a.id}));
 return out}
A_PAGES.calendar=()=>{const m=S.ui.calM||iso(T0).slice(0,7);const sel=S.ui.calDay||iso(T0);const F=S.ui.calF||Object.keys(EV_TYPES);const view=S.ui.calView||'month';
 const [y,mo]=m.split('-').map(Number);const first=new Date(y,mo-1,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
 const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d)}
 const ass=assessors();const rq=S.db.requests.filter(r=>r.status==='pending');
 const monthName=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
 const grid=view==='month'?`<div class="cal" role="grid" aria-label="${monthName}">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.map(d=>{const k=iso(d);const ev=calEvents(k).filter(e=>F.includes(e.type));const avail=ass.filter(a=>['full','am','pm'].includes(availOf(a.id,k))).length;const wk=d.getDay()===0||d.getDay()===6;
  return `<button class="day ${d.getMonth()!==mo-1?'out':''} ${k===iso(T0)?'today':''} ${k===sel?'sel':''}" data-act="calDay" data-d="${k}" aria-label="${fmtD(k)}, ${ev.length} events"><span class="dn"><span>${d.getDate()}</span>${!wk?`<span class="avail-pill" title="Assessors available">${avail}/${ass.length}</span>`:''}</span>${ev.slice(0,3).map(e=>`<span class="ev ${e.type}"><span>${esc(e.label)}</span></span>`).join('')}${ev.length>3?`<small>+${ev.length-3} more</small>`:''}</button>`}).join('')}</div>`
  :availMatrix(sel);
 const evs=calEvents(sel);
 return `<div class="ph"><div><span class="eyebrow">Scheduling</span><h2>Calendar</h2></div><div class="row"><div class="seg" role="group" aria-label="View"><button data-act="calView" data-v="month" aria-pressed="${view==='month'}">Month</button><button data-act="calView" data-v="avail" aria-pressed="${view==='avail'}">Assessor availability</button></div><button class="btn" data-act="newSession">New written sitting</button><button class="btn primary" data-act="newInterview">Schedule interview</button></div></div>
 ${rq.length?`<div class="card stack" style="border-color:var(--bad)"><div class="row between"><h3>Interview date requests</h3><span class="chip bad">${rq.length} pending</span></div>${rq.map(r=>{const a=APP(r.app);return `<div class="list-item" style="flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>${esc(U(a.user).name)}</b> ${lv(a.level)} <small>· requested ${fmtDT(r.at)}</small>${r.note?`<br><small>"${esc(r.note)}"</small>`:''}</div><div class="row">${r.dates.map(x=>{const n=panelAvail(x.date,x.slot);return `<button class="btn sm ${n>=S.db.settings.minPanel?'':'danger'}" data-act="confirmReq" data-id="${r.id}" data-d="${x.date}" data-s="${x.slot}">${new Date(x.date+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'})} ${x.slot==='am'?'AM':'PM'} · ${n} free</button>`}).join('')}<button class="btn sm ghost" data-act="proposeOther" data-id="${r.id}">Propose another date</button></div></div>`}).join('')}</div>`:''}
 <div class="cal-head"><button class="btn sm" data-act="calNav" data-n="-1" aria-label="Previous month">←</button><h3 style="min-width:170px;text-align:center">${monthName}</h3><button class="btn sm" data-act="calNav" data-n="1" aria-label="Next month">→</button><button class="btn sm" data-act="calToday">Today</button>
  <div class="legend right">${Object.entries(EV_TYPES).map(([k,t])=>`<label><input type="checkbox" data-chg="calFilter" value="${k}" ${F.includes(k)?'checked':''}><span class="ev ${k}" style="border-left-width:6px"><span>${t}</span></span></label>`).join('')}</div></div>
 <div class="cal-wrap">${grid}
 <aside class="card stack"><div><span class="eyebrow">${new Date(sel+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long'})}</span><h3>${fmtD(sel)}</h3></div>
  ${evs.length?evs.map(e=>`<div class="list-item"><span class="ev ${e.type}" style="width:10px;padding:0;height:34px;flex:none"></span><div style="flex:1;min-width:0"><span>${esc(e.label)}</span><br>${evAction(e)}</div></div>`).join(''):'<p class="muted">No events.</p>'}
  <hr><div class="row between"><h4>Assessor availability</h4><small>${ass.filter(a=>['full','am','pm'].includes(availOf(a.id,sel))).length} of ${ass.length}</small></div>
  ${ass.map(a=>{const v=availOf(a.id,sel);const b=bookedOn(a.id,sel);return `<div class="row between" style="font-size:.86rem"><span>${esc(a.name)}</span><span class="row" style="gap:4px">${b.length?'<span class="chip info">Booked</span>':''}<span class="chip ${AV_CHIP[v]}">${AV_LABEL[v]}</span></span></div>`}).join('')}
  <div class="row"><button class="btn sm" data-act="newInterview" data-d="${sel}">Interview on this day</button><button class="btn sm" data-act="newSession" data-d="${sel}">Sitting on this day</button></div>
  <button class="btn sm ghost" data-act="askAvail" style="align-self:flex-start">Email assessors to update availability</button></aside></div>`};
function availMatrix(sel){const ass=assessors();const days=[];let n=0;const base=new Date(sel+'T00:00:00');while(days.length<15){const d=new Date(base.getTime()+n*DAY);if(d.getDay()!==0&&d.getDay()!==6)days.push(iso(d));n++}
 return `<div class="tbl-wrap"><table><thead><tr><th>Assessor</th>${days.map(d=>`<th style="text-align:center">${new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2)}<br>${d.slice(8)}</th>`).join('')}</tr></thead><tbody>${ass.map(a=>`<tr><td style="white-space:nowrap">${esc(a.name)}</td>${days.map(d=>{const v=availOf(a.id,d);const b=bookedOn(a.id,d).length;return `<td style="text-align:center;padding:4px"><button class="btn sm ${b?'primary':''}" style="width:34px;padding:4px 0;background:${b?'':v==='full'?'var(--ok-soft)':v==='off'?'var(--bad-soft)':v?'var(--warn-soft)':''}" data-act="cycleAvail" data-a="${a.id}" data-d="${d}" title="${AV_LABEL[v]}${b?' · booked':''}">${b?'●':v==='full'?'✓':v==='am'?'AM':v==='pm'?'PM':v==='off'?'✕':'·'}</button></td>`}).join('')}</tr>`).join('')}
 <tr><td><b>Panel possible</b></td>${days.map(d=>{const am=panelAvail(d,'am'),pm=panelAvail(d,'pm');const ok=Math.max(am,pm)>=S.db.settings.minPanel;return `<td style="text-align:center"><span class="chip ${ok?'ok':'bad'}">${Math.max(am,pm)}</span></td>`}).join('')}</tr></tbody></table></div><small>Click a cell to change an assessor's availability on their behalf (all day → morning → afternoon → unavailable → not set). ● means already booked on a panel.</small>`}
function evAction(e){if(e.type==='written')return `<a data-go="a/session/${e.ref}">Open sitting</a>`;if(e.type==='interview')return `<a data-act="ivDetail" data-id="${e.ref}">Panel and confirmations</a>`;if(e.type==='request')return `<small>See requests above</small>`;if(e.type==='expiry')return `<a data-act="remind" data-id="${e.ref}">Send reminder</a>`;return `<a data-go="a/allocation">Allocation</a>`}
ACT.calDay=el=>{S.ui.calDay=el.dataset.d;render()};
ACT.calView=el=>{S.ui.calView=el.dataset.v;render()};
ACT.calNav=el=>{const m=(S.ui.calM||iso(T0).slice(0,7)).split('-').map(Number);const d=new Date(m[0],m[1]-1+ +el.dataset.n,1);S.ui.calM=iso(d).slice(0,7);render()};
ACT.calToday=()=>{S.ui.calM=iso(T0).slice(0,7);S.ui.calDay=iso(T0);render()};
ACT.calFilter=()=>{S.ui.calF=$$('[data-chg=calFilter]').filter(x=>x.checked).map(x=>x.value);render()};
ACT.cycleAvail=el=>{const o=['full','am','pm','off',''];const a=el.dataset.a,d=el.dataset.d;S.db.availability[a]=S.db.availability[a]||{};const v=availOf(a,d);const nx=o[(o.indexOf(v)+1)%o.length];if(nx)S.db.availability[a][d]=nx;else delete S.db.availability[a][d];save();render()};
ACT.askAvail=()=>{assessors().forEach(a=>{sendEmail(a.id,'CADCF: please update your availability','Please log in and mark your availability for the next 8 weeks.','Availability request');notify(a.id,'ISF asked you to update your availability.','s/availability')});save();toast('Availability request emailed to all assessors')};
function panelPicker(date,slot,app){const a=app&&APP(app);const inst=a?a.cred.institute:'';
 return assessors().filter(x=>x.panel).map((x,i)=>{const v=availOf(x.id,date);const ok=v==='full'||v===slot;const coi=inst&&(x.coi||[]).includes(inst);const lvOk=!a||x.levels.includes(a.level);const b=bookedOn(x.id,date).length;
  return `<div class="check"><input type="checkbox" id="pp-${x.id}" name="panel" value="${x.id}" ${ok&&!coi&&lvOk&&!b?'':''} ${coi?'disabled':''}><label for="pp-${x.id}">${esc(x.name)} <span class="chip ${ok?'ok':v==='off'?'bad':''}">${ok?'Available':AV_LABEL[v]}</span>${coi?' <span class="chip bad">Conflict of interest</span>':''}${!lvOk?' <span class="chip warn">Not qualified for level</span>':''}${b?' <span class="chip info">Already booked</span>':''}</label></div>`}).join('')}
function preselectPanel(date,slot,app){const a=app&&APP(app);const inst=a?a.cred.institute:'';let n=0;$$('#modal-root [name=panel]').forEach(cb=>{const x=U(cb.value);const v=availOf(x.id,date);if(n<S.db.settings.minPanel&&(v==='full'||v===slot)&&!(x.coi||[]).includes(inst)&&(!a||x.levels.includes(a.level))&&!bookedOn(x.id,date).length){cb.checked=true;n++}})}
ACT.confirmReq=el=>{const r=S.db.requests.find(x=>x.id===el.dataset.id);ivModal({app:r.app,date:el.dataset.d,slot:el.dataset.s,req:r.id})};
ACT.newInterview=el=>{ivModal({date:(el&&el.dataset.d)||dd(7),slot:'am'})};
function ivModal(o){const ready=S.db.applications.filter(a=>['lecture_passed','interview_requested'].includes(a.status));
 modal('Schedule panel interview',`<form class="stack" id="ivf" data-submit="ivCreate"><div class="field"><label for="iv-a">Candidate</label><select id="iv-a" name="app" data-chg="ivRefresh" required>${o.app?'':'<option value="">Choose a candidate ready for interview</option>'}${ready.map(a=>`<option value="${a.id}" ${a.id===o.app?'selected':''}>${esc(U(a.user).name)} · ${LEVELS[a.level].name}</option>`).join('')}</select></div>
 <div class="grid g2"><div class="field"><label for="iv-d">Date</label><input id="iv-d" type="date" name="date" value="${o.date}" data-chg="ivRefresh" required></div><div class="field"><label for="iv-t">Start time (IST)</label><select id="iv-t" name="time" data-chg="ivRefresh"><option value="10:30" ${o.slot==='am'?'selected':''}>10:30 (morning)</option><option value="15:00" ${o.slot==='pm'?'selected':''}>15:00 (afternoon)</option></select></div></div>
 <input type="hidden" name="req" value="${o.req||''}"><div><label>Panel (${S.db.settings.minPanel} to ${S.db.settings.maxPanel} assessors)</label><div class="stack" style="gap:6px" id="pp">${panelPicker(o.date,o.slot,o.app)}</div></div>
 <div class="note info">Each panellist gets an email and a portal request to confirm. The candidate is emailed once you save; the Zoom meeting is created automatically.</div></form>`,{wide:true,foot:'<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit" form="ivf">Schedule and send invitations</button>',after:()=>preselectPanel(o.date,o.slot,o.app)})}
ACT.ivRefresh=()=>{const f=$('#ivf');const d=formData(f);const slot=d.time==='10:30'?'am':'pm';$('#pp').innerHTML=panelPicker(d.date,slot,d.app);preselectPanel(d.date,slot,d.app)};
ACT.ivCreate=f=>{const d=formData(f);const panel=$$('#modal-root [name=panel]').filter(x=>x.checked).map(x=>x.value);const st=S.db.settings;
 if(!d.app){toast('Choose a candidate');return}if(panel.length<st.minPanel||panel.length>st.maxPanel){toast(`Choose ${st.minPanel} to ${st.maxPanel} panellists`);return}
 const a=APP(d.app);const u=U(a.user);const id='IV-'+(311+S.db.interviews.length);
 S.db.interviews.push({id,app:a.id,date:d.date,time:d.time,duration:45,panel,chair:panel[0],accept:Object.fromEntries(panel.map(p=>[p,'pending'])),zoom:'https://zoom.us/j/8'+Math.floor(Math.random()*1e10),status:'scheduled',scores:{}});
 a.interviewId=id;setStatus(a,'interview_booked','Scheduled for '+fmtD(d.date)+' '+d.time);if(d.req){const r=S.db.requests.find(x=>x.id===d.req);if(r)r.status='confirmed'}
 panel.forEach(p=>{tplMail('tpl-panel-invite',p,{assessor:U(p).name,candidate:u.name,level:LEVELS[a.level].name,date:fmtD(d.date),time:d.time},'Interview scheduled');notify(p,`Panel invitation: ${u.name}, ${fmtD(d.date)} ${d.time}. Please confirm.`,'s/dashboard')});
 tplMail('tpl-booked',u.id,{candidate:u.name,item:'panel interview',date:fmtD(d.date),time:d.time});notify(u.id,'Your panel interview is on '+fmtD(d.date)+' at '+d.time+' IST.','c/interview');
 audit('Interview scheduled, '+panel.length+' panellists invited',id);save();closeModal();S.ui.calDay=d.date;S.ui.calM=d.date.slice(0,7);render();toast('Interview scheduled. '+panel.length+' invitations emailed.')};
ACT.proposeOther=el=>{const r=S.db.requests.find(x=>x.id===el.dataset.id);const a=APP(r.app);modal('Propose another date',`<form class="stack" id="pof" data-submit="proposeSend"><input type="hidden" name="id" value="${r.id}"><p>Ask ${esc(U(a.user).name)} to choose again. The candidate will see new dates with panel availability.</p><div class="field"><label for="po-m">Message</label><textarea id="po-m" name="msg">None of your preferred dates has a full panel. Please choose new dates from the interview page.</textarea></div></form>`,{foot:'<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit" form="pof">Send</button>'})};
ACT.proposeSend=f=>{const d=formData(f);const r=S.db.requests.find(x=>x.id===d.id);const a=APP(r.app);r.status='declined';setStatus(a,'lecture_passed','Asked to choose new dates');a.messages.push({from:S.user.id,at:nowISO(),text:d.msg});sendEmail(a.user,'CADCF: please choose new interview dates',d.msg,'Interview reschedule');notify(a.user,'Please choose new interview dates.','c/interview');save();closeModal();render();toast('Candidate asked to choose new dates')};
ACT.ivDetail=el=>{const i=S.db.interviews.find(x=>x.id===el.dataset.id);const a=APP(i.app);
 modal(`Interview ${i.id}`,`<dl class="kv"><dt>Candidate</dt><dd>${esc(U(a.user).name)} ${lv(a.level)}</dd><dt>When</dt><dd>${fmtD(i.date)} · ${i.time} IST · ${i.duration} min</dd><dt>Zoom</dt><dd class="mono">${i.zoom}</dd></dl>
 <div class="tbl-wrap"><table><thead><tr><th>Panellist</th><th>Role</th><th>Confirmation</th><th></th></tr></thead><tbody>${i.panel.map(p=>`<tr><td>${esc(U(p).name)}</td><td>${p===i.chair?'Chair':'Member'}</td><td>${{accepted:'<span class="chip ok">Confirmed</span>',pending:'<span class="chip warn">Waiting</span>',declined:'<span class="chip bad">Declined</span>'}[i.accept[p]]}</td><td>${i.accept[p]!=='accepted'?`<button class="btn sm" data-act="nudge" data-i="${i.id}" data-p="${p}">Send reminder</button>`:''}</td></tr>`).join('')}</tbody></table></div>`,{wide:true,foot:`<button class="btn danger" data-act="cancelIv" data-id="${i.id}">Cancel interview</button><button class="btn primary" data-act="closeModal">Close</button>`})};
ACT.nudge=el=>{const p=el.dataset.p;sendEmail(p,'Reminder: please confirm your interview panel','Log in to confirm or decline.','Panel reminder');notify(p,'Reminder: confirm your panel invitation.','s/dashboard');save();toast('Reminder sent to '+U(p).name)};
ACT.cancelIv=el=>{const i=S.db.interviews.find(x=>x.id===el.dataset.id);i.status='cancelled';const a=APP(i.app);a.interviewId=null;setStatus(a,'lecture_passed','Interview cancelled by ISF');[...i.panel,a.user].forEach(p=>sendEmail(p,'CADCF: interview on '+fmtD(i.date)+' cancelled','The interview has been cancelled. A new date will follow.','Interview cancelled'));audit('Interview cancelled',i.id);save();closeModal();render();toast('Interview cancelled and everyone notified')};

/* ---------- written sittings ---------- */
ACT.newSession=el=>{const d=(el&&el.dataset&&el.dataset.d)||dd(14);modal('New written sitting',`<form class="stack" id="nsf" data-submit="createSession"><div class="grid g2"><div class="field"><label for="ns-d">Date</label><input id="ns-d" type="date" name="date" value="${d}" required></div><div class="field"><label for="ns-t">Start time (IST)</label><input id="ns-t" type="time" name="time" value="10:00" required></div>
 <div class="field"><label for="ns-l">Level</label><select id="ns-l" name="level">${Object.keys(LEVELS).map(k=>`<option value="${k}">${LEVELS[k].name}</option>`).join('')}</select></div><div class="field"><label for="ns-s">Seats</label><input id="ns-s" type="number" name="seats" value="6" min="1" max="20"></div></div>
 <div class="field"><label for="ns-i">Invigilator</label><select id="ns-i" name="inv"><option value="">Assign later</option>${S.db.users.filter(u=>u.role==='admin').map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="check"><input type="checkbox" id="ns-z" name="zoom" checked><label for="ns-z">Create the Zoom meeting now</label></div></form>`,{foot:'<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit" form="nsf">Create sitting</button>'})};
ACT.createSession=f=>{const d=formData(f);const id='WS-'+(1035+S.db.sessions.length);S.db.sessions.push({id,date:d.date,time:d.time,level:d.level,seats:+d.seats,invigilator:d.inv||null,zoom:d.zoom?'https://zoom.us/j/8'+Math.floor(Math.random()*1e10):'',candidates:[],attendance:{},log:[],status:'scheduled'});
 S.db.applications.filter(a=>a.status==='paid'&&a.level===d.level).forEach(a=>notify(a.user,'A new written sitting is open on '+fmtD(d.date)+'.','c/written'));audit('Written sitting created',id);save();closeModal();render();toast('Sitting '+id+' created. Eligible candidates notified.')};
A_PAGES.sessions=()=>{const list=[...S.db.sessions].sort((a,b)=>a.date.localeCompare(b.date));return `<div class="ph"><div><span class="eyebrow">Zoom-invigilated</span><h2>Written sittings</h2></div><button class="btn primary" data-act="newSession">New sitting</button></div>
 <div class="tbl-wrap"><table><thead><tr><th>Sitting</th><th>Date</th><th>Time</th><th>Level</th><th class="num">Booked</th><th>Invigilator</th><th>Zoom</th><th>Status</th></tr></thead><tbody>${list.map(s=>`<tr class="click" data-go="a/session/${s.id}"><td class="mono">${s.id}</td><td>${fmtD(s.date)}</td><td>${s.time}</td><td>${lv(s.level)}</td><td class="num">${s.candidates.length} / ${s.seats}</td><td>${s.invigilator?esc(U(s.invigilator).name):'<span class="chip warn">Not assigned</span>'}</td><td>${s.zoom?'<span class="chip ok">Ready</span>':'<span class="chip warn">Not created</span>'}</td><td>${s.status==='completed'?'<span class="chip">Completed</span>':daysTo(s.date)===0?'<span class="chip acc">Today</span>':'<span class="chip">Scheduled</span>'}</td></tr>`).join('')}</tbody></table></div>`};
A_PAGES.session=p=>{const s=S.db.sessions.find(x=>x.id===p[2]);if(!s)return 'Not found';return `<div class="ph"><div><a data-go="a/sessions">← Written sittings</a><h2>Sitting ${s.id}</h2></div><div class="row">${lv(s.level)}<span class="chip">${fmtD(s.date)} · ${s.time} IST</span></div></div>
 <div class="grid g2" style="align-items:start"><div class="card stack"><h3>Set-up</h3>
  <div class="field"><label for="ss-i">Invigilator</label><select id="ss-i" data-chg="sesInv" data-id="${s.id}"><option value="">Not assigned</option>${S.db.users.filter(u=>u.role==='admin').map(u=>`<option value="${u.id}" ${s.invigilator===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
  <dl class="kv"><dt>Zoom</dt><dd>${s.zoom?`<span class="mono">${s.zoom}</span>`:`<button class="btn sm" data-act="mkZoom" data-id="${s.id}">Create Zoom meeting</button>`}</dd><dt>Seats</dt><dd>${s.candidates.length} of ${s.seats} booked</dd></dl>
  <div class="row"><button class="btn" data-act="sendLinks" data-id="${s.id}" ${s.zoom&&s.candidates.length?'':'disabled'}>Email Zoom link to candidates</button>${s.status!=='completed'?`<button class="btn" data-act="closeSes" data-id="${s.id}">Mark sitting completed</button>`:''}</div></div>
 <div class="card stack"><h3>Candidates and attendance</h3>${s.candidates.length?s.candidates.map(id=>{const a=APP(id);return `<div class="check"><input type="checkbox" id="at-${id}" data-chg="attend" data-s="${s.id}" data-a="${id}" ${s.attendance[id]?'checked':''}><label for="at-${id}">${esc(U(a.user).name)} <small>· ${a.id} · ID checked on camera</small></label></div>`}).join(''):'<p class="muted">No bookings yet.</p>'}</div></div>
 <div class="card stack"><h3>Invigilator log</h3><div class="timeline">${s.log.map(l=>`<div><span class="pt"></span><div><b class="mono">${fmtDT(l.at)}</b> ${esc(l.text)}</div></div>`).join('')||'<p class="muted">No entries yet.</p>'}</div>

ACT.attend=el=>{const s=S.db.sessions.find(x=>x.id===el.dataset.s);s.attendance[el.dataset.a]=el.checked;save()};
