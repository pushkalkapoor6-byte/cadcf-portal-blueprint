/* ---------- applications ---------- */
const APP_TABS={all:'All',decide:'Needs decision',info:'Waiting on candidate',progress:'In assessment',certified:'Certified',closed:'Declined'};
function appFilter(a,t){return t==='all'||(t==='decide'&&a.status==='submitted')||(t==='info'&&['info_requested','offered','approved'].includes(a.status))||(t==='progress'&&STATUS[a.status].stage>=3&&STATUS[a.status].stage<7&&a.status!=='failed')||(t==='certified'&&a.status==='certified')||(t==='closed'&&['declined','lapsed','failed'].includes(a.status))}
A_PAGES.applications=()=>{const t=S.ui.appTab||'decide';const q=(S.ui.appQ||'').toLowerCase();const lvF=S.ui.appLv||'';
 const list=S.db.applications.filter(a=>appFilter(a,t)&&(!lvF||a.level===lvF)&&(!q||(U(a.user).name+a.id+a.cred.institute).toLowerCase().includes(q))).sort((a,b)=>b.created.localeCompare(a.created));
 return `<div class="ph"><div><span class="eyebrow">${S.db.applications.length} applications</span><h2>Applications</h2></div><div class="row"><input type="search" placeholder="Search name, ID, institute" aria-label="Search" value="${esc(S.ui.appQ||'')}" data-chg="appQ" style="width:240px"><select aria-label="Level" data-chg="appLv" style="width:auto"><option value="">All levels</option>${Object.keys(LEVELS).map(k=>`<option value="${k}" ${lvF===k?'selected':''}>${LEVELS[k].name}</option>`).join('')}</select></div></div>
 <div class="tabs" role="tablist">${Object.entries(APP_TABS).map(([k,v])=>`<button role="tab" aria-selected="${k===t}" data-act="appTab" data-t="${k}">${v} <span class="chip">${S.db.applications.filter(a=>appFilter(a,k)).length}</span></button>`).join('')}</div>
 <div class="tbl-wrap"><table><thead><tr><th>Application</th><th>Candidate</th><th>Level</th><th>Pre-check</th><th>Country</th><th>Submitted</th><th>Status</th></tr></thead><tbody>${list.map(a=>{const pc=precheck(a.level,a.cred,a.docs);const bad=pc.filter(x=>x[0]==='bad').length;return `<tr class="click" data-go="a/application/${a.id}"><td class="mono">${a.id}</td><td><b>${esc(U(a.user).name)}</b><br><small>${esc(a.cred.institute)}</small></td><td>${lv(a.level)}</td><td>${bad?`<span class="chip bad">${bad} rule${bad>1?'s':''} unmet</span>`:'<span class="chip ok">All met</span>'}</td><td>${esc(U(a.user).country)}</td><td>${fmtD(a.created)}</td><td>${stChip(a.status)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No applications in this view.</td></tr>'}</tbody></table></div>`};
ACT.appTab=el=>{S.ui.appTab=el.dataset.t;render()};ACT.appQ=el=>{S.ui.appQ=el.value;render()};ACT.appLv=el=>{S.ui.appLv=el.value;render()};
A_PAGES.application=p=>{const a=APP(p[2]);if(!a)return '<div class="card">Application not found.</div>';const u=U(a.user);const pc=precheck(a.level,a.cred,a.docs);const pays=S.db.payments.filter(x=>x.user===u.id);
 const ind=indicated(u);
 return `<div class="ph"><div><a data-go="a/applications">← Applications</a><h2>${esc(u.name)} · ${LEVELS[a.level].name}</h2><small class="mono">${a.id} · ${esc(u.member)} · ${esc(u.email)}</small></div>${stChip(a.status)}</div>
 <div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start">
 <div class="stack">
  <div class="card stack"><h3>Credentials</h3><dl class="kv"><dt>Role</dt><dd>${esc(a.cred.title)}</dd><dt>Institute</dt><dd>${esc(a.cred.institute)}</dd><dt>Country</dt><dd>${esc(u.country)}</dd><dt>Years teaching</dt><dd>${a.cred.years}</dd><dt>Hours (3 yrs)</dt><dd>${a.cred.hours}</dd><dt>CoC</dt><dd>${esc(a.cred.coc)}</dd><dt>Trainer course</dt><dd>${esc(a.cred.trainer)}</dd><dt>Leads faculty</dt><dd>${a.cred.mgmt?'Yes':'No'}</dd><dt>Self-evaluation</dt><dd>${ind?'Indicates '+lv(ind):'Not enough ratings'}</dd></dl>
   <div><label>Statement</label><p>${esc(a.statement)}</p></div>
   <div><label>Documents</label><div class="filelist">${a.docs.map(d=>`<button class="chip" data-act="viewDoc" data-n="${esc(d)}">${esc(d)}</button>`).join('')}</div></div></div>
  <div class="card stack"><h3>Eligibility pre-check · ${LEVELS[a.level].name}</h3>${precheckHTML(pc)}</div>
  ${adminStagePanel(a)}
  <div class="card stack"><h3>Messages</h3>${a.messages.map(m=>`<div class="msg ${m.from===S.user.id||U(m.from).role==='admin'?'mine':''}"><small>${esc(U(m.from).name)} · ${fmtDT(m.at)}</small><br>${esc(m.text)}</div>`).join('')||'<p class="muted">No messages.</p>'}
   <form class="stack" data-submit="adminMsg"><input type="hidden" name="id" value="${a.id}"><textarea name="text" placeholder="Write to the candidate (they get an email)…" style="min-height:70px" aria-label="Message" required></textarea><button class="btn" style="align-self:flex-start">Send message</button></form></div>
 </div>
 <div class="stack">
  ${a.status==='submitted'?`<div class="card stack" style="border-color:var(--accent)"><h3>Eligibility decision</h3>
   <div class="field"><label for="dec-m">Message to candidate</label><textarea id="dec-m" style="min-height:90px">${pc.some(x=>x[0]==='bad')?'Thank you for applying. Based on your experience, ':'Your credentials meet the guide. Please pay within '+S.db.settings.holdDays+' days to keep this decision.'}</textarea></div>
   <button class="btn primary" data-act="decide" data-d="approve" data-id="${a.id}">Approve ${LEVELS[a.level].name}</button>
   <div class="row"><select id="dec-l" aria-label="Offer level" style="flex:1;width:auto">${Object.keys(LEVELS).filter(k=>k!==a.level).map(k=>`<option value="${k}">${LEVELS[k].name}</option>`).join('')}</select><button class="btn" data-act="decide" data-d="offer" data-id="${a.id}">Offer this level</button></div>
   <div class="row"><button class="btn" data-act="decide" data-d="info" data-id="${a.id}">Request information</button><button class="btn danger" data-act="decide" data-d="decline" data-id="${a.id}">Decline</button></div>
   <small>The decision, message and your name are saved to the audit log.</small></div>`:''}
  <div class="card stack"><h3>History</h3><div class="timeline">${a.history.map(h=>`<div><span class="pt"></span><div><b>${(STATUS[h.status]||{label:h.status}).label}</b><br><small>${fmtDT(h.at)} · ${esc(U(h.by).name||h.by)}</small>${h.note?`<br><span class="muted">${esc(h.note)}</span>`:''}</div></div>`).join('')}</div></div>
  <div class="card stack"><h3>Payments</h3>${pays.map(x=>`<div class="row between" style="font-size:.86rem"><span>${esc(x.item)}</span><span>${money(x.currency,x.amount)} ${payChip(x.status)}</span></div>`).join('')||'<p class="muted">None.</p>'}${a.status==='approved'?`<button class="btn sm" data-act="payReminder" data-id="${a.id}" style="align-self:flex-start">Send payment reminder</button>`:''}</div>
  <div class="card stack"><h3>Internal note</h3><textarea aria-label="Internal note" data-chg="appNote" data-id="${a.id}" placeholder="Only ISF staff can see this" style="min-height:70px">${esc(a.note||'')}</textarea></div>
 </div></div>`};
function adminStagePanel(a){const sc=a.scores;const st=a.status;let body='';
 if(st==='written_submitted')body=`<p class="muted">Objective: ${sc.objective!=null?sc.objective+' / '+sc.objectiveMax:'—'}. Subjective: ${sc.subjective!=null?sc.subjective+'%':'awaiting assessor'}.</p><div class="row"><button class="btn primary" data-act="stageRes" data-id="${a.id}" data-r="written_pass">Publish: written passed</button><button class="btn danger" data-act="stageRes" data-id="${a.id}" data-r="written_fail">Publish: not yet competent</button></div>`;
 else if(st==='lecture_submitted')body=`<p class="muted">Lecture: ${esc(a.lecture?a.lecture.topic:'')}. Assessor result: ${sc.lecture||'pending'}.</p><div class="row"><button class="btn primary" data-act="stageRes" data-id="${a.id}" data-r="lecture_pass">Publish: lecture passed</button><button class="btn danger" data-act="stageRes" data-id="${a.id}" data-r="lecture_fail">Publish: not yet competent</button></div>`;
 else if(st==='interview_booked'){const iv=S.db.interviews.find(x=>x.id===a.interviewId);const sub=iv?Object.keys(iv.scores).length:0;body=`<p class="muted">Interview ${iv?fmtD(iv.date)+' '+iv.time:''}. Panel scores submitted: ${sub} of ${iv?iv.panel.length:0}${sub?' · average '+(Object.values(iv.scores).reduce((x,y)=>x+y,0)/sub).toFixed(1):''}.</p><button class="btn primary" data-act="stageRes" data-id="${a.id}" data-r="to_moderation" style="align-self:flex-start">Close interview and move to moderation</button>`}
 else if(st==='moderation')body=`<p class="muted">All components complete. Check the scores and issue the certificate.</p><div class="row"><button class="btn primary" data-act="issueCert" data-id="${a.id}">Issue certificate</button><button class="btn danger" data-act="stageRes" data-id="${a.id}" data-r="final_fail">Not yet competent</button></div>`;
 if(STATUS[a.status].stage<3&&!body)return '';
 return `<div class="card stack"><h3>Assessment record</h3><dl class="kv"><dt>Written objective</dt><dd>${sc.objective!=null?sc.objective+' / '+sc.objectiveMax:'—'}</dd><dt>Written subjective</dt><dd>${sc.subjective!=null?sc.subjective+'%':'—'}</dd><dt>Lecture</dt><dd>${sc.lecture||'—'}</dd><dt>Interview</dt><dd>${sc.interview!=null?sc.interview+' / 5':'—'}</dd></dl>${body}</div>`}
ACT.viewDoc=el=>modal(esc(el.dataset.n),'<div class="player" style="aspect-ratio:1/1.3">Document preview</div>',{wide:true});
ACT.appNote=el=>{APP(el.dataset.id).note=el.value;save();toast('Note saved')};
ACT.payReminder=el=>{const a=APP(el.dataset.id);sendEmail(a.user,'CADCF: reminder to pay your certification fee','Your approval is held for '+S.db.settings.holdDays+' days from the decision date.','Payment reminder');notify(a.user,'Reminder: pay your certification fee.','c/payments');save();toast('Payment reminder sent')};
ACT.adminMsg=f=>{const d=formData(f);const a=APP(d.id);a.messages.push({from:S.user.id,at:nowISO(),text:d.text});sendEmail(a.user,'CADCF: message about your application',d.text,'Admin message');notify(a.user,'New message from ISF about your application.','c/application');save();render();toast('Message sent')};
ACT.decide=el=>{const a=APP(el.dataset.id);const u=U(a.user);const msg=$('#dec-m').value;const kind=el.dataset.d;
 if(kind==='approve'){setStatus(a,'approved',msg);notify(u.id,'Eligibility approved for '+LEVELS[a.level].name+'. Pay to continue.','c/payments')}
 if(kind==='offer'){a.offerLevel=$('#dec-l').value;setStatus(a,'offered','Offered '+LEVELS[a.offerLevel].name);notify(u.id,'ISF has offered you '+LEVELS[a.offerLevel].name+' level.','c/application')}
 if(kind==='info'){setStatus(a,'info_requested',msg);notify(u.id,'ISF needs more information about your application.','c/application')}
 if(kind==='decline'){setStatus(a,'declined',msg);notify(u.id,'Decision on your application.','c/application')}
 a.messages.push({from:S.user.id,at:nowISO(),text:msg});tplMail('tpl-elig',u.id,{candidate:u.name,level:LEVELS[a.level].name,message:msg},'Eligibility decision');audit({approve:'Approved application',offer:'Offered different level',info:'Requested information',decline:'Declined application'}[kind],a.id);save();render();toast('Decision saved and emailed to '+u.name)};
ACT.stageRes=el=>{const a=APP(el.dataset.id);const u=U(a.user);const r=el.dataset.r;
 const map={written_pass:['written_passed','Written assessment passed. Upload your lecture next.','c/lecture'],written_fail:['failed','Written assessment: not yet competent. See remarks.','c/results'],lecture_pass:['lecture_passed','Lecture passed. Choose your interview dates.','c/interview'],lecture_fail:['failed','Lecture review: not yet competent.','c/results'],to_moderation:['moderation','Your interview is complete. Final moderation is under way.','c/dashboard'],final_fail:['failed','Final result: not yet competent.','c/results']}[r];
 if(r==='written_pass'&&a.scores.subjective==null)a.scores.subjective=65;if(r==='lecture_pass'&&!a.scores.lecture)a.scores.lecture='Competent';if(r==='lecture_fail')a.scores.lecture='Not yet competent';
 if(r==='to_moderation'){const iv=S.db.interviews.find(x=>x.id===a.interviewId);const v=iv&&Object.values(iv.scores);a.scores.interview=v&&v.length?+(v.reduce((x,y)=>x+y,0)/v.length).toFixed(1):3.5;if(iv)iv.status='completed'}
 setStatus(a,map[0]);notify(u.id,map[1],map[2]);sendEmail(u.id,'CADCF: update on your certification',map[1],'Stage result');audit('Result published: '+r.replace('_',' '),a.id);save();render();toast('Result published and candidate notified')};
ACT.issueCert=el=>{const a=APP(el.dataset.id);const u=U(a.user);const yr=new Date().getFullYear();const id=`CADCF-${a.level[0].toUpperCase()}-${yr}-${String(200+S.db.certificates.length).padStart(5,'0')}`;
 S.db.certificates.unshift({id,user:u.id,name:u.name,level:a.level,issued:dd(0),expires:dd(S.db.settings.validityYears*365),status:'valid',reminders:[]});a.certId=id;setStatus(a,'certified','Certificate '+id);
 notify(u.id,'Congratulations. Your CADCF certificate is ready.','c/results');sendEmail(u.id,'CADCF: your certificate '+id,'Your certificate and verification link are in your portal.','Certificate issued');audit('Certificate issued',id);save();render();toast('Certificate '+id+' issued')};

 return `<div class="ph"><div><span class="eyebrow">${candidates().length} registered</span><h2>Candidates</h2></div><div class="row"><input type="search" placeholder="Search" aria-label="Search candidates" value="${esc(S.ui.cQ||'')}" data-chg="cQ" style="width:240px"><button class="btn" data-act="csv">Export CSV</button></div></div>

ACT.cQ=el=>{S.ui.cQ=el.value;render()};ACT.csv=()=>toast('CSV export downloaded');
ACT.candModal=el=>{const u=U(el.dataset.id);modal(esc(u.name),`<dl class="kv"><dt>Member</dt><dd>${u.member}</dd><dt>Email</dt><dd>${esc(u.email)}</dd><dt>Country</dt><dd>${esc(u.country)}</dd><dt>Registered</dt><dd>${fmtD(u.created)}</dd><dt>Access pass</dt><dd>${hasPass(u)?'Valid to '+fmtD(u.pass.until):'None'}</dd><dt>Self-evaluation</dt><dd>${Object.keys(u.selfEval).length} of ${COMPS.length}</dd><dt>Videos watched</dt><dd>${u.watched.length}</dd></dl>`,{foot:`<button class="btn" data-act="grantPass" data-id="${u.id}">Grant complimentary pass</button><button class="btn primary" data-act="closeModal">Close</button>`})};

/* ---------- allocation ---------- */
const KIND={script:'Written script (first marking)',script2:'Written script (second marking)',lecture:'Recorded lecture'};
A_PAGES.allocation=()=>{const list=S.db.allocations;const order={unallocated:0,declined:1,pending:2,accepted:3,done:4};
 return `<div class="ph"><div><span class="eyebrow">Marking and reviews</span><h2>Allocation</h2></div></div>
 <div class="note info">Assessors with a declared conflict of interest with the candidate's institute, or not qualified for the level, are not offered. Written scripts are shown to assessors without the candidate's name.</div>

  return `<tr><td>${KIND[x.kind]}<br><small class="mono">${x.id}</small></td><td>${esc(U(a.user).name)}</td><td>${lv(a.level)}</td><td>${fmtD(x.due)}</td>
  <td>${['unallocated','declined'].includes(x.status)?`<select aria-label="Assessor" id="al-${x.id}" style="width:auto"><option value="">Choose…</option>${elig.map(s=>`<option value="${s.id}">${esc(s.name)} · ${S.db.allocations.filter(z=>z.assessor===s.id&&['pending','accepted'].includes(z.status)).length} open</option>`).join('')}</select>`:esc(U(x.assessor).name)}</td>
  <td>${{unallocated:'<span class="chip warn">Not allocated</span>',pending:'<span class="chip warn">Awaiting acceptance</span>',accepted:'<span class="chip acc">Accepted</span>',declined:'<span class="chip bad">Declined</span>',done:'<span class="chip ok">Submitted</span>'}[x.status]}</td>
  <td>${['unallocated','declined'].includes(x.status)?`<button class="btn sm primary" data-act="allocate" data-id="${x.id}">Allocate and email</button>`:x.status==='pending'?`<button class="btn sm" data-act="allocNudge" data-id="${x.id}">Remind</button>`:x.status==='done'?`<button class="btn sm" data-go="a/application/${a.id}">Open record</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`};
ACT.allocate=el=>{const x=S.db.allocations.find(z=>z.id===el.dataset.id);const v=$('#al-'+x.id).value;if(!v){toast('Choose an assessor first');return}const a=APP(x.app);x.assessor=v;x.status='pending';x.at=nowISO();
 tplMail('tpl-assess-invite',v,{assessor:U(v).name,candidate:x.kind==='lecture'?U(a.user).name:'A candidate',item:KIND[x.kind].toLowerCase(),due:fmtD(x.due)},'Allocation');notify(v,`New ${KIND[x.kind].toLowerCase()} allocated. Please accept.`,'s/dashboard');audit('Allocated '+x.kind+' to '+U(v).name,x.id);save();render();toast('Allocated. '+U(v).name+' has been emailed.')};

A_PAGES.integrity=()=>`<div class="ph"><div><span class="eyebrow">Originality and conduct</span><h2>Integrity cases</h2></div></div>
 <div class="note info">An AI-detection score alone is not proof. Decide with the typing record, the invigilator log and the assessor's view, and probe in the interview where needed.</div>
 <div class="tbl-wrap"><table><thead><tr><th>Case</th><th>Candidate</th><th>Source</th><th>Evidence</th><th>Assessor view</th><th>Outcome</th></tr></thead><tbody>${S.db.integrity.map(i=>{const a=APP(i.app);return `<tr><td class="mono">${i.id}</td><td>${esc(U(a.user).name)}</td><td>${esc(i.source)} · ${esc(i.q)}</td><td style="max-width:280px">${esc(i.evidence)}</td><td>${esc(i.assessorView||'—')}</td><td><select aria-label="Outcome" data-chg="icOut" data-id="${i.id}" style="width:auto">${['pending','No action','Probe in interview','Void answer','Void attempt'].map(o=>`<option ${i.outcome===o?'selected':''}>${o}</option>`).join('')}</select>${i.reviewer?`<br><small>by ${esc(U(i.reviewer).name)}</small>`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No cases.</td></tr>'}</tbody></table></div>`;
ACT.icOut=el=>{const i=S.db.integrity.find(x=>x.id===el.dataset.id);i.outcome=el.value;i.reviewer=S.user.id;audit('Integrity outcome: '+el.value,i.id);save();render();toast('Outcome recorded')};

/* ---------- results ---------- */
A_PAGES.results=()=>{const list=S.db.applications.filter(a=>['written_submitted','lecture_submitted','interview_booked','moderation'].includes(a.status));
 return `<div class="ph"><div><span class="eyebrow">Publish stage results</span><h2>Results and moderation</h2></div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Candidate</th><th>Level</th><th>Stage</th><th>Written</th><th>Lecture</th><th>Interview</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td><b>${esc(U(a.user).name)}</b></td><td>${lv(a.level)}</td><td>${stChip(a.status)}</td><td class="num">${a.scores.objective!=null?a.scores.objective+'/'+a.scores.objectiveMax:'—'}${a.scores.subjective!=null?' · '+a.scores.subjective+'%':''}</td><td>${a.scores.lecture||'—'}</td><td>${a.scores.interview!=null?a.scores.interview:'—'}</td><td><button class="btn sm primary" data-go="a/application/${a.id}">Review and publish</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nothing waiting.</td></tr>'}</tbody></table></div>`};

/* ---------- certificates ---------- */
A_PAGES.certificates=()=>{const f=S.ui.certF||'90';const list=S.db.certificates.filter(c=>f==='all'||(f==='expired'&&(daysTo(c.expires)<0||c.status!=='valid'))||(f!=='all'&&f!=='expired'&&c.status==='valid'&&daysTo(c.expires)>=0&&daysTo(c.expires)<=+f)).sort((a,b)=>a.expires.localeCompare(b.expires));
 return `<div class="ph"><div><span class="eyebrow">Registry</span><h2>Certificates</h2></div><div class="seg" role="group" aria-label="Filter">${[['30','Expiring in 30 days'],['90','In 90 days'],['expired','Expired or revoked'],['all','All']].map(([k,t])=>`<button data-act="certF" data-f="${k}" aria-pressed="${f===k}">${t}</button>`).join('')}</div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Number</th><th>Holder</th><th>Level</th><th>Issued</th><th>Expires</th><th>Reminders</th><th></th></tr></thead><tbody>${list.map(c=>{const d=daysTo(c.expires);return `<tr><td class="mono">${c.id}</td><td>${esc(c.name)}</td><td>${lv(c.level)}</td><td>${fmtD(c.issued)}</td><td>${c.status==='revoked'?'<span class="chip bad">Revoked</span>':d<0?`<span class="chip bad">Expired ${fmtD(c.expires)}</span>`:`<span class="chip ${d<=30?'bad':d<=90?'warn':'ok'}">${fmtD(c.expires)} · ${d} d</span>`}</td><td>${c.reminders.length?c.reminders.length+' sent, last '+fmtD(c.reminders.slice(-1)[0]):'None'}</td><td class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="certView" data-id="${c.id}">View</button>${c.status==='valid'?`<button class="btn sm" data-act="remind" data-id="${c.id}">Remind</button><button class="btn sm ghost" data-act="revoke" data-id="${c.id}">Revoke</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No certificates in this view.</td></tr>'}</tbody></table></div>
 <small>Automatic reminders go out 90 and 30 days before expiry.</small>`};
ACT.certF=el=>{S.ui.certF=el.dataset.f;render()};
ACT.certView=el=>modal('Certificate',certHTML(S.db.certificates.find(x=>x.id===el.dataset.id)),{wide:true});
ACT.revoke=el=>{modal('Revoke certificate?',`<p>Revoking <b>${el.dataset.id}</b> shows it as revoked on the public verification page. This cannot be undone here.</p><div class="field"><label for="rv">Reason</label><textarea id="rv" style="min-height:70px"></textarea></div>`,{foot:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="doRevoke" data-id="${el.dataset.id}">Revoke</button>`})};
ACT.doRevoke=el=>{const c=S.db.certificates.find(x=>x.id===el.dataset.id);c.status='revoked';audit('Certificate revoked: '+($('#rv').value||'no reason given'),c.id);save();closeModal();render();toast('Certificate revoked')};

/* ---------- assessors ---------- */
A_PAGES.assessors=()=>{const days=[];for(let n=0;n<14;n++){const d=dd(n);const w=new Date(d+'T00:00:00').getDay();if(w&&w<6)days.push(d)}
 return `<div class="ph"><div><span class="eyebrow">${assessors().length} assessors</span><h2>Assessors and panellists</h2></div><button class="btn primary" data-act="inviteAssessor">Invite assessor</button></div>
 <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Levels</th><th>Expertise</th><th>Conflicts declared</th><th class="num">Open work</th><th class="num">Available days (next 2 weeks)</th></tr></thead><tbody>${assessors().map(a=>`<tr><td><b>${esc(a.name)}</b><br><small>${esc(a.email)}</small></td><td>${a.levels.map(l=>lv(l)).join(' ')}</td><td>${esc(a.expertise||'')}</td><td>${(a.coi||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join(' ')||'—'}</td><td class="num">${S.db.allocations.filter(z=>z.assessor===a.id&&['pending','accepted'].includes(z.status)).length+S.db.interviews.filter(i=>i.status==='scheduled'&&i.panel.includes(a.id)).length}</td><td class="num">${days.filter(d=>['full','am','pm'].includes(availOf(a.id,d))).length} / ${days.length}</td></tr>`).join('')}</tbody></table></div>`};
ACT.inviteAssessor=()=>modal('Invite assessor',`<form class="stack" id="iaf" data-submit="doInviteA"><div class="field"><label for="ia-n">Name</label><input id="ia-n" name="name" type="text" required></div><div class="field"><label for="ia-e">Email</label><input id="ia-e" name="email" type="email" required></div><div><label>Qualified levels</label><div class="row">${Object.keys(LEVELS).map(k=>`<div class="check"><input type="checkbox" id="ia-${k}" name="lv_${k}" ${k==='basic'?'checked':''}><label for="ia-${k}">${LEVELS[k].name}</label></div>`).join('')}</div></div></form>`,{foot:'<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit" form="iaf">Send invitation</button>'});
ACT.doInviteA=f=>{const d=formData(f);const id='a'+(assessors().length+1);S.db.users.push({id,role:'assessor',name:d.name,email:d.email,password:'demo',levels:Object.keys(LEVELS).filter(k=>d['lv_'+k]),panel:true,coi:[],expertise:''});S.db.emails.unshift({id:uid('EM'),to:d.email,toName:d.name,subject:'Invitation to join the CADCF assessor panel',body:'Set your password and two-step sign-in to get started.',at:nowISO(),trigger:'Assessor invitation'});audit('Assessor invited',d.email);save();closeModal();render();toast('Invitation sent')};

/* ---------- payments ---------- */
A_PAGES.payments=()=>{const f=S.ui.payF||'all';const list=S.db.payments.filter(p=>f==='all'||p.status===f);const tot={INR:0,USD:0,tax:0};S.db.payments.filter(p=>p.status==='captured').forEach(p=>{tot[p.currency]+=p.amount;tot.tax+=p.currency==='INR'?p.tax:0});
 return `<div class="ph"><div><span class="eyebrow">Gateway: Razorpay (INR), Stripe (USD)</span><h2>Payments</h2></div><div class="row"><select aria-label="Status" data-chg="payF" style="width:auto">${[['all','All'],['captured','Paid'],['failed','Failed'],['refund_requested','Refund requested'],['refunded','Refunded']].map(([k,t])=>`<option value="${k}" ${f===k?'selected':''}>${t}</option>`).join('')}</select><button class="btn" data-act="csv">Export for accounts</button></div></div>
 <div class="grid g3"><div class="card kpi"><small>Collected (INR, before tax)</small><b>${money('INR',tot.INR)}</b></div><div class="card kpi"><small>Collected (USD)</small><b>${money('USD',tot.USD)}</b></div><div class="card kpi"><small>GST collected</small><b>${money('INR',tot.tax)}</b></div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Reference</th><th>Candidate</th><th>Item</th><th>Gateway</th><th class="num">Amount</th><th class="num">GST</th><th>Status</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>${fmtD(p.at)}</td><td class="mono">${p.id}</td><td>${esc(U(p.user).name)}</td><td>${esc(p.item)}</td><td>${p.gateway}</td><td class="num">${money(p.currency,p.amount)}</td><td class="num">${p.tax?money('INR',p.tax):'—'}</td><td>${payChip(p.status)}</td><td>${p.status==='refund_requested'?`<button class="btn sm" data-act="refund" data-id="${p.id}">Approve refund</button>`:p.status==='captured'?`<button class="btn sm ghost" data-act="invoice" data-id="${p.id}">Invoice</button>`:''}</td></tr>`).join('')}</tbody></table></div>`};
ACT.payF=el=>{S.ui.payF=el.value;render()};
ACT.refund=el=>{const p=S.db.payments.find(x=>x.id===el.dataset.id);p.status='refunded';sendEmail(p.user,'CADCF: refund processed','Your refund of '+money(p.currency,p.amount+p.tax)+' has been processed. Allow 5 to 7 working days.','Refund');notify(p.user,'Your refund has been processed.','c/payments');audit('Refund approved',p.id);save();render();toast('Refund processed through the gateway')};

/* ---------- emails ---------- */
A_PAGES.emails=()=>{const t=S.ui.emT||'outbox';return `<div class="ph"><div><span class="eyebrow">Automated messages</span><h2>Emails</h2></div></div>
 <div class="tabs" role="tablist"><button role="tab" aria-selected="${t==='outbox'}" data-act="emT" data-t="outbox">Sent (${S.db.emails.length})</button><button role="tab" aria-selected="${t==='tpl'}" data-act="emT" data-t="tpl">Templates</button><button role="tab" aria-selected="${t==='rules'}" data-act="emT" data-t="rules">When emails go out</button></div>
 ${t==='outbox'?`<div class="tbl-wrap"><table><thead><tr><th>Sent</th><th>To</th><th>Subject</th><th>Trigger</th></tr></thead><tbody>${S.db.emails.map(e=>`<tr class="click" data-act="viewEmail" data-id="${e.id}"><td>${fmtDT(e.at)}</td><td>${esc(e.toName)}<br><small>${esc(e.to)}</small></td><td>${esc(e.subject)}</td><td><span class="chip">${esc(e.trigger)}</span></td></tr>`).join('')}</tbody></table></div>`:
 t==='tpl'?`<div class="grid g2">${S.db.templates.map(x=>`<div class="card stack"><h4>${esc(x.name)}</h4><small class="mono">${esc(x.subject)}</small><p class="muted" style="white-space:pre-wrap;font-size:.84rem">${esc(x.body.slice(0,160))}…</p><button class="btn sm" data-act="editTpl" data-id="${x.id}" style="align-self:flex-start">Edit</button></div>`).join('')}</div>`:
 `<div class="tbl-wrap"><table><thead><tr><th>Event</th><th>Who is emailed</th></tr></thead><tbody>${[['Candidate registers','Candidate (verification code)'],['Application submitted','Candidate; ISF admin'],['Eligibility decision, offer or information request','Candidate'],['Payment captured or failed','Candidate; ISF Finance'],['Written sitting booked; 24 h and 30 min reminders','Candidate'],['Written test or lecture submitted','ISF admin (to allocate)'],['Script or lecture allocated','Assessor (accept within 48 h)'],['Allocation not accepted in 48 h','Assessor reminder; ISF admin'],['Interview dates requested','ISF admin'],['Interview scheduled','Each panellist (confirm availability); candidate'],['Panellist declines','ISF admin (replace panellist)'],['Stage result published','Candidate'],['Certificate issued','Candidate'],['Certificate expiring in 90 and 30 days','Holder'],['Availability not updated for 30 days','Assessor']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`}`};
ACT.emT=el=>{S.ui.emT=el.dataset.t;render()};
ACT.viewEmail=el=>{const e=S.db.emails.find(x=>x.id===el.dataset.id);modal('Email',`<dl class="kv"><dt>To</dt><dd>${esc(e.toName)} &lt;${esc(e.to)}&gt;</dd><dt>Sent</dt><dd>${fmtDT(e.at)}</dd><dt>Subject</dt><dd><b>${esc(e.subject)}</b></dd></dl><div class="answer">${esc(e.body)}</div>`,{wide:true})};
ACT.editTpl=el=>{const t=S.db.templates.find(x=>x.id===el.dataset.id);modal('Edit template: '+esc(t.name),`<form class="stack" id="tpf" data-submit="saveTpl"><input type="hidden" name="id" value="${t.id}"><div class="field"><label for="tp-s">Subject</label><input id="tp-s" name="subject" type="text" value="${esc(t.subject)}"></div><div class="field"><label for="tp-b">Body</label><textarea id="tp-b" name="body" style="min-height:200px">${esc(t.body)}</textarea></div><small>Placeholders in double braces, e.g. {{candidate}}, {{date}}, are filled automatically.</small></form>`,{wide:true,foot:'<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit" form="tpf">Save template</button>'})};
ACT.saveTpl=f=>{const d=formData(f);Object.assign(S.db.templates.find(x=>x.id===d.id),{subject:d.subject,body:d.body});save();closeModal();render();toast('Template saved')};

/* ---------- content ---------- */
A_PAGES.content=()=>{const t=S.ui.ctT||'std';return `<div class="ph"><div><span class="eyebrow">What candidates see</span><h2>Content</h2></div></div>
 <div class="tabs" role="tablist">${[['std','Standard'],['vid','Videos'],['qb','Question bank'],['se','Self-evaluation']].map(([k,v])=>`<button role="tab" aria-selected="${t===k}" data-act="ctT" data-t="${k}">${v}</button>`).join('')}</div>
 ${t==='std'?`<div class="grid g2"><div class="card stack"><h3>Edition ${S.db.edition.current}</h3><span class="chip ok" style="align-self:flex-start">Published ${fmtD(S.db.edition.published)}</span><p class="muted">${COMPS.length} competencies in ${DOMAINS.length} domains. Candidates are assessed against the edition current on the day they applied.</p></div><div class="card stack"><h3>Edition ${S.db.edition.draft} draft</h3><div class="upload"><b>Upload the new edition (PDF)</b><input type="file" accept="application/pdf" aria-label="Upload edition"></div><button class="btn" data-act="publishEd">Publish edition ${S.db.edition.draft}</button></div></div>`:
 t==='vid'?`<div class="row"><button class="btn primary" data-act="addVideo">Add video</button></div><div class="tbl-wrap"><table><thead><tr><th>Title</th><th>Domain</th><th>Level</th><th class="num">Minutes</th><th class="num">Watched by</th></tr></thead><tbody>${S.db.videos.map(v=>`<tr><td>${esc(v.title)}</td><td>${v.domain}</td><td>${lv(v.level)}</td><td class="num">${v.mins}</td><td class="num">${candidates().filter(u=>u.watched.includes(v.id)).length}</td></tr>`).join('')}</tbody></table></div>`:
 t==='qb'?`<div class="row"><button class="btn primary" data-act="addQ">Add question</button><button class="btn" data-act="csv">Import from Excel</button></div><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Type</th><th>Competency</th><th>Level</th><th>Question</th></tr></thead><tbody>${S.db.questions.map(q=>`<tr><td class="mono">${q.id}</td><td>${q.type==='mcq'?'Objective':'Subjective'}</td><td>${q.comp}</td><td>${lv(q.level)}</td><td style="max-width:440px">${esc(q.text)}</td></tr>`).join('')}</tbody></table></div>`:
 `<div class="card stack"><p class="muted">Candidates rate themselves on all ${COMPS.length} competencies at Not yet, Basic, Advanced or Leadership. The readiness report averages ratings per domain.</p><div class="hbars">${DOMAINS.map(d=>{const n=candidates().filter(u=>Object.keys(u.selfEval).some(k=>k.startsWith(d.id.replace('D','C')))).length;return `<div><span>${d.id} ${d.name.split(' ')[0]}</span><i style="width:${n/candidates().length*100}%"></i><span class="num">${n}</span></div>`}).join('')}</div><small>Candidates who have rated at least one competency in each domain.</small></div>`}`};
ACT.ctT=el=>{S.ui.ctT=el.dataset.t;render()};
ACT.publishEd=()=>toast('Edition published. Candidates are notified of the change.');
ACT.addVideo=()=>modal('Add video',`<form class="stack" id="avf" data-submit="saveVideo"><div class="field"><label for="av-t">Title</label><input id="av-t" name="title" type="text" required></div><div class="grid g2"><div class="field"><label for="av-d">Domain</label><select id="av-d" name="domain">${DOMAINS.map(d=>`<option value="${d.id}">${d.id} ${d.name}</option>`).join('')}</select></div><div class="field"><label for="av-l">Level</label><select id="av-l" name="level">${Object.keys(LEVELS).map(k=>`<option value="${k}">${LEVELS[k].name}</option>`).join('')}</select></div></div><div class="grid g2"><div class="field"><label for="av-m">Minutes</label><input id="av-m" name="mins" type="number" value="20"></div><div class="field"><label for="av-u">Video host ID</label><input id="av-u" name="host" type="text" placeholder="Domain-locked video ID"></div></div></form>`,{foot:'<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit" form="avf">Add video</button>'});
ACT.saveVideo=f=>{const d=formData(f);S.db.videos.push({id:uid('v'),title:d.title,domain:d.domain,level:d.level,mins:+d.mins});save();closeModal();render();toast('Video added')};
ACT.addQ=()=>modal('Add question',`<form class="stack" id="aqf" data-submit="saveQ"><div class="grid g2"><div class="field"><label for="aq-t">Type</label><select id="aq-t" name="type"><option value="mcq">Objective (4 options)</option><option value="subjective">Subjective</option></select></div><div class="field"><label for="aq-c">Competency</label><select id="aq-c" name="comp">${COMPS.map(c=>`<option>${c.id}</option>`).join('')}</select></div></div><div class="field"><label for="aq-x">Question</label><textarea id="aq-x" name="text" required style="min-height:80px"></textarea></div><div class="grid g2">${'ABCD'.split('').map(l=>`<div class="field"><label for="aq-${l}">Option ${l}</label><input id="aq-${l}" name="o${l}" type="text"></div>`).join('')}</div><div class="field"><label for="aq-k">Correct option</label><select id="aq-k" name="key"><option>A</option><option>B</option><option>C</option><option>D</option></select></div></form>`,{wide:true,foot:'<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit" form="aqf">Save question</button>'});
ACT.saveQ=f=>{const d=formData(f);S.db.questions.push({id:'Q-'+(200+S.db.questions.length),type:d.type,comp:d.comp,level:'basic',text:d.text,options:[d.oA,d.oB,d.oC,d.oD],answer:'ABCD'.indexOf(d.key),marks:10});save();closeModal();render();toast('Question saved')};

/* ---------- feedback, settings, audit ---------- */
A_PAGES.feedback=()=>`<div class="ph"><h2>Feedback on the standard and portal</h2></div><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>From</th><th>Section</th><th>Type</th><th>Feedback</th><th>Status</th></tr></thead><tbody>${S.db.feedback.map(f=>`<tr><td>${fmtD(f.at)}</td><td>${esc(U(f.user).name)}</td><td>${esc(f.section)}</td><td>${esc(f.type)}</td><td style="max-width:360px">${esc(f.text)}</td><td>${f.status==='open'?`<button class="btn sm" data-act="fbDone" data-id="${f.id}">Mark resolved</button>`:'<span class="chip ok">Resolved</span>'}</td></tr>`).join('')}</tbody></table></div>`;
ACT.fbDone=el=>{S.db.feedback.find(x=>x.id===el.dataset.id).status='resolved';save();render()};
A_PAGES.settings=()=>{const s=S.db.settings;return `<div class="ph"><div><span class="eyebrow">Scheme rules</span><h2>Settings</h2></div><button class="btn primary" form="setf">Save settings</button></div>
 <form id="setf" class="stack lg" data-submit="saveSettings">
 <div class="card stack"><h3>Fees</h3><div class="tbl-wrap"><table><thead><tr><th>Item</th><th>INR (before GST)</th><th>USD</th></tr></thead><tbody><tr><td>Access pass</td><td><input type="number" name="acc_INR" value="${s.accessFee.INR}" aria-label="Access INR"></td><td><input type="number" name="acc_USD" value="${s.accessFee.USD}" aria-label="Access USD"></td></tr>${Object.keys(LEVELS).map(k=>`<tr><td>${LEVELS[k].name} certification</td><td><input type="number" name="fee_${k}_INR" value="${s.fees[k].INR}" aria-label="${k} INR"></td><td><input type="number" name="fee_${k}_USD" value="${s.fees[k].USD}" aria-label="${k} USD"></td></tr>`).join('')}</tbody></table></div>

S_PAGES.availability=()=>{const me=S.user;const m=S.ui.avM||iso(T0).slice(0,7);const [y,mo]=m.split('-').map(Number);const first=new Date(y,mo-1,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
 const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d)}
 return `<div class="ph"><div><span class="eyebrow">Used by ISF to form interview panels</span><h2>My availability</h2></div><div class="row"><button class="btn" data-act="avBulk" data-v="full">All weekdays available</button><button class="btn" data-act="avBulk" data-v="">Clear month</button></div></div>
 <div class="cal-head"><button class="btn sm" data-act="avNav" data-n="-1" aria-label="Previous month">←</button><h3 style="min-width:170px;text-align:center">${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><button class="btn sm" data-act="avNav" data-n="1" aria-label="Next month">→</button>
 <div class="legend right"><span class="av"><i class="av-full"></i>All day</span><span class="av"><i class="av-am"></i>Morning</span><span class="av"><i class="av-pm"></i>Afternoon</span><span class="av"><i class="av-off"></i>Unavailable</span><span class="av"><i style="background:var(--accent)"></i>Booked</span></div></div>
 <div class="cal acal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.map(d=>{const k=iso(d);const v=availOf(me.id,k);const b=bookedOn(me.id,k);const past=daysTo(k)<0;
  return `<button class="day ${d.getMonth()!==mo-1?'out':''} ${k===iso(T0)?'today':''}" ${past?'disabled style="opacity:.4;cursor:default"':''} data-act="${past?'':'avCycle'}" data-d="${k}" aria-label="${fmtD(k)}: ${AV_LABEL[v]}"><span class="dn"><span>${d.getDate()}</span></span>${b.length?`<span class="state booked">Panel ${b[0].time}</span>`:''}${v?`<span class="state ${v}">${{full:'All day',am:'Morning',pm:'Afternoon',off:'Unavailable'}[v]}</span>`:''}</button>`}).join('')}</div>
 <small>Click a day to cycle: all day → morning → afternoon → unavailable → not set. Morning panels start 10:30 IST, afternoon panels 15:00 IST.</small>`};
ACT.avNav=el=>{const m=(S.ui.avM||iso(T0).slice(0,7)).split('-').map(Number);S.ui.avM=iso(new Date(m[0],m[1]-1+ +el.dataset.n,1)).slice(0,7);render()};
ACT.avCycle=el=>{const o=['full','am','pm','off',''];const a=S.user.id,d=el.dataset.d;S.db.availability[a]=S.db.availability[a]||{};const nx=o[(o.indexOf(availOf(a,d))+1)%o.length];if(nx)S.db.availability[a][d]=nx;else delete S.db.availability[a][d];save();render()};

  <div class="field"><label for="lv-o">Overall judgement</label><select id="lv-o"><option>Competent</option><option>Not yet competent</option></select></div>
  <div class="field"><label for="lv-r">Summary remark</label><textarea id="lv-r" style="min-height:70px"></textarea></div>
  <button class="btn primary" data-act="submitLec" data-id="${x.id}">Submit review</button></div></div>`};
ACT.lecRem=f=>{const d=formData(f);S.ui.lecRem.push({t:d.t,text:d.text});render()};
ACT.submitLec=el=>{const x=S.db.allocations.find(z=>z.id===el.dataset.id);const a=APP(x.app);x.status='done';x.result=$('#lv-o').value;a.scores.lecture=x.result;a.lecture=a.lecture||{};a.lecture.remarks=[...S.ui.lecRem,{t:'Summary',text:$('#lv-r').value||'—'}];S.ui.lecRem=[];
 notify('s1',`${S.user.name} reviewed the lecture of ${U(a.user).name}: ${x.result}.`,'a/application/'+a.id);audit('Lecture review submitted',x.id);save();go('s/assignments');toast('Review submitted to ISF')};

/* ---------- interviews ---------- */
S_PAGES.interviews=()=>`<div class="ph"><h2>Interview panels</h2></div><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Candidate</th><th>Level</th><th>Your role</th><th>Your confirmation</th><th></th></tr></thead><tbody>${myPanels().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>{const a=APP(i.app);const st=i.accept[S.user.id];return `<tr><td>${fmtD(i.date)} · ${i.time}</td><td>${esc(U(a.user).name)}</td><td>${lv(a.level)}</td><td>${i.chair===S.user.id?'Chair':'Member'}</td><td>${{accepted:'<span class="chip ok">Confirmed</span>',pending:'<span class="chip warn">Waiting for you</span>',declined:'<span class="chip bad">Declined</span>'}[st]}</td><td>${st==='pending'?`<button class="btn sm primary" data-act="ivAccept" data-id="${i.id}">Accept</button>`:st==='accepted'&&i.status==='scheduled'?`<button class="btn sm" data-go="s/interview/${i.id}">Scoring sheet</button>`:i.status==='completed'?'<span class="chip">Completed</span>':''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No panels yet.</td></tr>'}</tbody></table></div>`;
S_PAGES.interview=p=>{const i=S.db.interviews.find(x=>x.id===p[2]);if(!i)return 'Not found';const a=APP(i.app);const u=U(a.user);const ic=S.db.integrity.filter(c=>c.app===a.id);const mine=i.scores[S.user.id];
 return `<div class="ph"><div><a data-go="s/interviews">← Interview panels</a><h2>${esc(u.name)} · ${LEVELS[a.level].name}</h2><small>${fmtD(i.date)} · ${i.time} IST · ${i.duration} min · ${i.chair===S.user.id?'You are chair':'Panel member'}</small></div><a class="btn primary" href="${i.zoom}" target="_blank" rel="noopener">Join Zoom</a></div>
 <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start"><div class="stack">
  <div class="card stack"><h3>Briefing pack</h3><dl class="kv"><dt>Institute</dt><dd>${esc(a.cred.institute)}</dd><dt>Experience</dt><dd>${a.cred.years} years, ${a.cred.hours} hours</dd><dt>Written</dt><dd>${a.scores.objective!=null?a.scores.objective+'/'+a.scores.objectiveMax:'—'} objective · ${a.scores.subjective!=null?a.scores.subjective+'%':'—'} subjective</dd><dt>Lecture</dt><dd>${a.scores.lecture||'—'}</dd></dl>
  ${ic.length?`<div class="note bad"><b>Integrity flag:</b> ${esc(ic[0].evidence)} Ask the candidate to explain that answer in their own words.</div>`:''}</div>
  <div class="card stack"><h3>Suggested questions</h3><ol style="margin:0;padding-left:18px;font-size:.9rem"><li>Walk us through how you design an assessment for a practical skill.</li><li>Tell us about a session that did not go to plan. What did you change?</li><li>How do you use AI tools when preparing lessons, and where do you stop?</li><li>${a.level==='leadership'?'How do you develop the faculty you lead?':'How do you check that every learner has understood?'}</li></ol></div></div>
 <div class="card stack"><h3>Your scores</h3><small>Scored independently. You see other panellists' scores only after everyone submits.</small>
  ${mine!=null?`<div class="note ok">You submitted an average of <b>${mine}</b>.</div>`:`${rubric(i.id,[['D1 Course design',5],['D2 Delivery',5],['D3 Assessment',5],['D4 Professional conduct and leadership',5],['D5 Contemporary skills',5]])}<div class="field"><label for="iv-c">Comments</label><textarea id="iv-c" style="min-height:80px"></textarea></div><button class="btn primary" data-act="ivScore" data-id="${i.id}">Submit scores</button>`}
  <hr><h4>Panel progress</h4>${i.panel.map(pid=>`<div class="row between" style="font-size:.86rem"><span>${esc(U(pid).name)}${pid===i.chair?' (chair)':''}</span>${i.scores[pid]!=null?`<span class="chip ok">Submitted${Object.keys(i.scores).length===i.panel.length?' · '+i.scores[pid]:''}</span>`:'<span class="chip">Pending</span>'}</div>`).join('')}
  ${Object.keys(i.scores).length===i.panel.length?`<div class="note info">Panel average <b>${(Object.values(i.scores).reduce((x,y)=>x+y,0)/i.panel.length).toFixed(1)}</b> of 5. ISF moderates and publishes the result.</div>`:''}</div></div>`};
ACT.ivScore=el=>{const i=S.db.interviews.find(x=>x.id===el.dataset.id);const n=5;let s=0,c=0;for(let k=0;k<n;k++){if(S.ui.rub[i.id+k]!=null){s+=S.ui.rub[i.id+k];c++}}if(c<n){toast('Score all five domains before submitting');return}
 i.scores[S.user.id]=+(s/n).toFixed(1);notify('s1',S.user.name+' submitted interview scores for '+U(APP(i.app).user).name,'a/application/'+i.app);audit('Interview scores submitted',i.id);save();render();toast('Scores submitted')};

/* ---------- profile ---------- */
S_PAGES.profile=()=>{const me=S.user;return `<div class="ph"><h2>Profile and conflicts of interest</h2></div><div class="grid g2" style="align-items:start">
 <div class="card stack"><h3>Details</h3><dl class="kv"><dt>Email</dt><dd>${esc(me.email)}</dd><dt>Qualified levels</dt><dd>${me.levels.map(l=>lv(l)).join(' ')}</dd><dt>Expertise</dt><dd>${esc(me.expertise||'')}</dd><dt>Panels</dt><dd>${me.panel?'Yes':'No'}</dd><dt>Two-step sign-in</dt><dd><span class="chip ok">On</span></dd></dl></div>
 <div class="card stack"><h3>Conflicts of interest</h3><p class="muted">Institutes or people you cannot assess fairly. ISF will not allocate their work to you.</p><div class="filelist">${(me.coi||[]).map((c,i)=>`<span class="chip">${esc(c)} <button class="btn sm ghost" style="padding:0 4px" data-act="coiDel" data-i="${i}" aria-label="Remove">✕</button></span>`).join('')||'<small>None declared.</small>'}</div>
  <form class="row" data-submit="coiAdd"><input type="text" name="c" placeholder="Institute or person" aria-label="Add conflict" style="flex:1;min-width:0" required><button class="btn">Add</button></form><small>Confirm your declarations every 6 months.</small></div></div>`};
ACT.coiAdd=f=>{S.user.coi=S.user.coi||[];S.user.coi.push(formData(f).c);audit('Conflict of interest declared',S.user.id);save();render()};
ACT.coiDel=el=>{S.user.coi.splice(+el.dataset.i,1);save();render()};

/* ============================ BOOT ============================ */
(function(){let h='';try{h=(location.hash||'').replace(/^#\/?/,'')}catch(e){}S.path=h;render()})();
</script>

</body>
</html>
